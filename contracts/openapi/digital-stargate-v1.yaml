openapi: 3.1.0
info:
  title: Digital StarGate API
  version: 1.0.0
  description: Contratto iniziale della piattaforma Digital StarGate. Non rappresenta un'implementazione attiva.
servers:
  - url: /api/v1
paths:
  /observation-sessions:
    post:
      operationId: CreateObservationSession
      summary: Crea una sessione osservativa
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObservationSessionRequest'
      responses:
        '201':
          description: Sessione creata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationSession'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    get:
      operationId: SearchObservationSessions
      summary: Ricerca sessioni osservative
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Elenco paginato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationSessionPage'
  /observation-sessions/{id}:
    get:
      operationId: GetObservationSession
      summary: Legge una sessione osservativa
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sessione trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationSession'
        '404':
          $ref: '#/components/responses/Problem'
  /equipment/{id}/status:
    get:
      operationId: GetEquipmentStatus
      summary: Legge lo stato di un componente
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Stato del componente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentStatus'
        '404':
          $ref: '#/components/responses/Problem'
  /weather:
    get:
      operationId: GetWeather
      summary: Legge l'ultimo snapshot meteorologico
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Snapshot meteorologico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherSnapshot'
  /telemetry:
    get:
      operationId: GetTelemetry
      summary: Legge campioni di telemetria
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: source
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Campioni di telemetria
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TelemetrySample' }
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Errore conforme a RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    CreateObservationSessionRequest:
      type: object
      additionalProperties: false
      required: [targetId, observatoryId]
      properties:
        targetId: { type: string, format: uuid }
        observatoryId: { type: string, format: uuid }
    ObservationSession:
      type: object
      additionalProperties: false
      required: [id, targetId, observatoryId, status]
      properties:
        id: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        observatoryId: { type: string, format: uuid }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        status: { type: string }
    ObservationSessionPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ObservationSession' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer, format: int64 }
    EquipmentStatus:
      type: object
      required: [id, name, type, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        status: { type: string }
    WeatherSnapshot:
      type: object
      required: [capturedAt, temperatureCelsius, humidityPercentage, windSpeedMetersPerSecond, isSafe]
      properties:
        capturedAt: { type: string, format: date-time }
        temperatureCelsius: { type: number }
        humidityPercentage: { type: number, minimum: 0, maximum: 100 }
        windSpeedMetersPerSecond: { type: number, minimum: 0 }
        skyQualityMagnitudesPerSquareArcsecond: { type: [number, 'null'] }
        isSafe: { type: boolean }
    TelemetrySample:
      type: object
      required: [capturedAt, source, metric, value, unit]
      properties:
        capturedAt: { type: string, format: date-time }
        source: { type: string }
        metric: { type: string }
        value: { type: number }
        unit: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status, errorCode, category]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'], format: uri-reference }
        errorCode: { type: string }
        category:
          type: string
          enum: [Validation, Business, Infrastructure, Security]
        correlationId: { type: [string, 'null'], format: uuid }
        errors:
          type: [array, 'null']
          items:
            type: object
            required: [code, field, message]
            properties:
              code: { type: string }
              field: { type: string }
              message: { type: string }
