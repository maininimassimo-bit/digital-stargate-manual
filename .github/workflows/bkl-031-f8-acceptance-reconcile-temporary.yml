name: BKL-031 F8 Acceptance Reconcile Temporary

on:
  push:
    branches:
      - chore/bkl-031-f8-acceptance-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[f8-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bkl-031-f8-acceptance-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align temporary reconciler with current MkDocs label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/reconcile-bkl-031-f8-acceptance.mjs')
          s = p.read_text()
          old = "- BKL-031 F7 Fresh Forecast Supply Acceptance: project/BKL-031-F7-FRESH-FORECAST-SUPPLY-ACCEPTANCE-2026-09-17.md"
          new = "- BKL-031 F7 - Fresh Protected-Site Forecast Supply Acceptance: project/BKL-031-F7-FRESH-FORECAST-SUPPLY-ACCEPTANCE-2026-09-17.md"
          if old not in s:
              raise SystemExit('temporary reconciler MkDocs anchor not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Reconcile F8 acceptance and handover
        run: node .github/scripts/reconcile-bkl-031-f8-acceptance.mjs
      - name: Remove temporary reconciliation helper
        run: |
          git rm -f .github/scripts/reconcile-bkl-031-f8-acceptance.mjs
          git rm -f .github/workflows/bkl-031-f8-acceptance-reconcile-temporary.yml
      - name: Commit reconciled governance state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "chore(bkl-031): reconcile F8 acceptance and promote F9 [f8-reconciled]"
          git push origin HEAD:chore/bkl-031-f8-acceptance-reconciliation
