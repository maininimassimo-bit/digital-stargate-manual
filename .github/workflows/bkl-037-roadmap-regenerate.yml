name: BKL-037 Roadmap Regenerate

on:
  push:
    branches:
      - governance/bkl-037-promotion

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: governance/bkl-037-promotion
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical roadmap projection
        run: node .github/scripts/generate-roadmap.mjs --write
      - name: Commit generated projection when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/data/roadmap.json; then
            echo "Projection already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/roadmap.json
          git commit -m "chore(roadmap): regenerate BKL-037 promotion projection"
          git push origin HEAD:governance/bkl-037-promotion
