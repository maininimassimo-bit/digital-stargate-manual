name: PixInsight local pilot contract
on:
  pull_request:
    paths: ['tools/pixinsight/local_pilot/**', 'infrastructure/pixinsight-pilot/**', 'docs/pixinsight-pilot*/**', 'docs/javascripts/pixinsight-pilot*.js', '.github/workflows/pixinsight-local-pilot.yml']
  push:
    branches: [main]
    paths: ['tools/pixinsight/local_pilot/**', 'infrastructure/pixinsight-pilot/**', 'docs/pixinsight-pilot*/**', 'docs/javascripts/pixinsight-pilot*.js', '.github/workflows/pixinsight-local-pilot.yml']
permissions:
  contents: read
jobs:
  preflight-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic preflight rejection and multi-image selection
        run: node --test tools/pixinsight/local_pilot/preflight.test.mjs tools/pixinsight/local_pilot/executor.test.mjs tools/pixinsight/local_pilot/owner_check.test.mjs tools/pixinsight/local_pilot/p6_owner_check.test.mjs tools/pixinsight/local_pilot/scientific_portal.test.mjs tools/pixinsight/local_pilot/source_preparation.test.mjs tools/pixinsight/local_pilot/preparation_executor.test.mjs tools/pixinsight/local_pilot/measurements.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test local coordinator reservation and private retention
        run: |
          python -m pip install "Pillow>=11,<13" "numpy>=2,<3"
          python -m unittest tools.pixinsight.local_pilot.test_worker tools.pixinsight.local_pilot.test_quality tools.pixinsight.local_pilot.test_image_analysis tools.pixinsight.local_pilot.test_transport tools.pixinsight.local_pilot.test_scientific_portal tools.pixinsight.local_pilot.test_scientific_revisions tools.pixinsight.local_pilot.test_intake tools.pixinsight.local_pilot.test_source_profile tools.pixinsight.local_pilot.test_preparation tools.pixinsight.local_pilot.test_preparation_flow tools.pixinsight.local_pilot.test_historical_source tools.pixinsight.local_pilot.test_openai_planner tools.pixinsight.local_pilot.test_adaptive_catalog tools.pixinsight.local_pilot.test_adaptive_ledger tools.pixinsight.local_pilot.test_native_measurements tools.pixinsight.local_pilot.test_source_provenance tools.pixinsight.local_pilot.test_image_previews tools.pixinsight.local_pilot.test_adaptive_provider tools.pixinsight.local_pilot.test_checkpoint_control tools.pixinsight.local_pilot.test_checkpoint_provider
