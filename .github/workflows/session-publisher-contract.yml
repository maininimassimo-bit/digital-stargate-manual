name: Session Publisher Contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/dsdm/session-importer/Publish-DSGSessionPackage.ps1'
      - 'tools/dsdm/session-importer/Start-DSGPreviousNightSessionPublish.ps1'
      - 'tools/dsdm/session-importer/session-publisher.sample.json'
      - '.github/workflows/session-publisher-contract.yml'
  pull_request:
    paths:
      - 'tools/dsdm/session-importer/Publish-DSGSessionPackage.ps1'
      - 'tools/dsdm/session-importer/Start-DSGPreviousNightSessionPublish.ps1'
      - 'tools/dsdm/session-importer/session-publisher.sample.json'
      - '.github/workflows/session-publisher-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell publisher scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'tools/dsdm/session-importer/Publish-DSGSessionPackage.ps1',
            'tools/dsdm/session-importer/Start-DSGPreviousNightSessionPublish.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }
      - name: Validate sample configuration
        shell: pwsh
        run: |
          $config = Get-Content 'tools/dsdm/session-importer/session-publisher.sample.json' -Raw | ConvertFrom-Json
          foreach ($name in @('RepositoryRoot','NinaLogDirectory','Phd2LogDirectory','WeatherCsvPath','ObservatoryName','TimeZoneId')) {
            if ([string]::IsNullOrWhiteSpace([string]$config.$name)) { throw "Missing sample configuration value: $name" }
          }
