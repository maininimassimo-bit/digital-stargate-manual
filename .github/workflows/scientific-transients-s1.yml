name: Scientific transients S1 preparation
on:
  pull_request:
    paths: ['tools/scientific_transients/**', 'docs/javascripts/scientific-transients-portal.js', 'docs/scientific-transient-analysis/**', 'docs/styles/scientific-transients.css', 'tools/pixinsight/local_pilot/transport_http.py', 'infrastructure/pixinsight-pilot/**', 'docs/project/BKL-051-S1-*', 'docs/project/evidence/BKL-051-*', '.github/workflows/scientific-transients-s1.yml']
  push:
    branches: [main]
    paths: ['tools/scientific_transients/**', 'docs/javascripts/scientific-transients-portal.js', 'docs/scientific-transient-analysis/**', 'docs/styles/scientific-transients.css', 'tools/pixinsight/local_pilot/transport_http.py', 'infrastructure/pixinsight-pilot/**', 'docs/project/BKL-051-S1-*', 'docs/project/evidence/BKL-051-*', '.github/workflows/scientific-transients-s1.yml']
permissions:
  contents: read
jobs:
  offline-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify browser fixture matches the actual synthetic queue Owner contract
        run: python -m tools.scientific_transients.portal_fixture --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify proposed intake rejects unsafe scientific claims without network
        run: node --test tools/scientific_transients/contract.test.mjs tools/scientific_transients/reference.test.mjs tools/scientific_transients/measurement.test.mjs tools/scientific_transients/uncertainty.test.mjs tools/scientific_transients/epoch.test.mjs tools/scientific_transients/pixel.test.mjs tools/scientific_transients/native_aperture.test.mjs tools/scientific_transients/portal.test.mjs
      - name: Test dedicated private queue lifecycle and HTTP roles
        run: python -m unittest tools.scientific_transients.test_queue tools.scientific_transients.test_local_registry tools.scientific_transients.test_attempt_journal tools.scientific_transients.test_receipt_coordinator tools.scientific_transients.test_native_aperture tools.scientific_transients.test_native_supervisor tools.scientific_transients.test_local_report tools.scientific_transients.test_local_driver tools.scientific_transients.test_reservation_intent tools.scientific_transients.test_owner_recovery tools.scientific_transients.test_operator_run
