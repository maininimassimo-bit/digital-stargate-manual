name: Scientific transients S1 preparation
on:
  pull_request:
    paths: ['tools/scientific_transients/**', 'docs/javascripts/scientific-*.js', 'docs/javascripts/dsg-theme-manager.js', 'docs/javascripts/s4-lab-*', 'docs/scientific-transients-lab/**', 'docs/scientific-transient-analysis/**', 'docs/styles/scientific-transients.css', 'tools/pixinsight/local_pilot/transport_http.py', 'infrastructure/scientific-transients-lab/**', 'infrastructure/pixinsight-pilot/**', 'docs/project/BKL-051-S1-*', 'docs/project/evidence/BKL-051-*', '.github/workflows/scientific-transients-s1.yml', '.github/scripts/test-transient-mpc-schema.ps1']
  push:
    branches: [main]
    paths: ['tools/scientific_transients/**', 'docs/javascripts/scientific-*.js', 'docs/javascripts/dsg-theme-manager.js', 'docs/javascripts/s4-lab-*', 'docs/scientific-transients-lab/**', 'docs/scientific-transient-analysis/**', 'docs/styles/scientific-transients.css', 'tools/pixinsight/local_pilot/transport_http.py', 'infrastructure/scientific-transients-lab/**', 'infrastructure/pixinsight-pilot/**', 'docs/project/BKL-051-S1-*', 'docs/project/evidence/BKL-051-*', '.github/workflows/scientific-transients-s1.yml', '.github/scripts/test-transient-mpc-schema.ps1']
permissions:
  contents: read
jobs:
  offline-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify browser fixture matches the actual synthetic queue Owner contract
        run: python -m tools.scientific_transients.portal_fixture --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all scientific transient browser contracts and private local views
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem -LiteralPath tools/scientific_transients -Filter '*.test.mjs' | ForEach-Object { $_.FullName }
          if ($testFiles.Count -eq 0) { throw 'No scientific transient browser tests found' }
          node --test @testFiles
      - name: Verify all offline scientific transient Python contracts and lifecycle checks
        shell: pwsh
        run: |
          $testModules = Get-ChildItem -LiteralPath tools/scientific_transients -Filter 'test_*.py' | ForEach-Object { 'tools.scientific_transients.' + $_.BaseName }
          if ($testModules.Count -eq 0) { throw 'No scientific transient Python tests found' }
          python -m unittest @testModules -v
      - name: Validate private synthetic MPC XML against pinned official submission schema
        shell: pwsh
        run: ./.github/scripts/test-transient-mpc-schema.ps1
  isolated-lab-sdk-api-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install existing cloud dependency family for offline lab API compatibility
        run: python -m pip install --requirement infrastructure/scientific-transients-lab/requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Verify SDK interfaces and synthetic 412 accounting with ADC and network replaced
        run: python -m unittest tools.scientific_transients.lab_sdk_checks -v
  local-tpv-coordinate-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned optional local-coordinate dependencies in CI only
        run: python -m pip install --requirement tools/scientific_transients/requirements-astrometry-local.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Verify synthetic TPV known answers and conservative rejection
        run: python -m unittest tools.scientific_transients.tpv_coordinates_checks -v
