name: BKL-043 F4 Pilot Artifact and Receiver Validation
on:
  pull_request:
    paths:
      - 'scripts/telemetry/Start-BKL043-F4Pilot.ps1'
      - 'infrastructure/bkl043-f4-receiver/**'
      - 'infrastructure/bkl043-f4-pilot/**'
      - '.github/workflows/bkl-043-f4-pilot-validation.yml'
      - '.github/workflows/bkl-043-f4-github-outcome-reporter.yml'
permissions:
  contents: read
jobs:
  receiver-contract:
    name: Synthetic receiver contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned receiver and test dependencies
        run: python -m pip install --disable-pip-version-check -r infrastructure/bkl043-f4-receiver/requirements.txt -r infrastructure/bkl043-f4-receiver/tests/requirements.txt
      - name: Run synthetic tests without cloud credentials
        run: python -m pytest -q infrastructure/bkl043-f4-receiver/tests
  portable-package:
    name: Parse and package the manual Windows collector
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse script without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/telemetry/Start-BKL043-F4Pilot.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify nested and flat receipt task arrays
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/telemetry/Start-BKL043-F4Pilot.ps1',
            [ref]$tokens,
            [ref]$errors
          )
          $fn = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Normalize-ReceiptTaskArray' }, $true)
          if ($null -eq $fn) { throw 'NORMALIZER_FUNCTION_MISSING' }
          Invoke-Expression $fn.Extent.Text
          $items = @(
            [pscustomobject]@{ name = 'task-a' }
            [pscustomobject]@{ name = 'task-b' }
            [pscustomobject]@{ name = 'task-c' }
          )
          $nested = [object[]]::new(1)
          $nested[0] = [object[]]$items
          $legacy = [pscustomobject]@{ signals = [pscustomobject]@{ tasks = $nested } }
          if (-not (Normalize-ReceiptTaskArray $legacy)) { throw 'LEGACY_ARRAY_NOT_NORMALIZED' }
          $roundTrip = ($legacy | ConvertTo-Json -Depth 12 -Compress) | ConvertFrom-Json
          if ($roundTrip.signals.tasks.Count -ne 3) { throw 'NORMALIZED_ARRAY_ROUNDTRIP_FAILED' }
          $flat = [pscustomobject]@{ signals = [pscustomobject]@{ tasks = [object[]]$items } }
          if (Normalize-ReceiptTaskArray $flat) { throw 'FLAT_ARRAY_WAS_UNEXPECTEDLY_CHANGED' }
          try {
            $invalid = [pscustomobject]@{ signals = [pscustomobject]@{ tasks = @([pscustomobject]@{ name = 'one' }) } }
            Normalize-ReceiptTaskArray $invalid
            throw 'INVALID_ARRAY_WAS_ACCEPTED'
          } catch {
            if ($_.Exception.Message -ne 'TASK_SIGNAL_COUNT_INVALID') { throw }
          }
      - name: Stage the portable collector
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'BKL043-F4-Portable-Collector'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'scripts/telemetry/Start-BKL043-F4Pilot.ps1' $stage
          Copy-Item 'infrastructure/bkl043-f4-pilot/README.md' $stage
      - name: Upload reviewable package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: BKL043-F4-Portable-Collector-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/BKL043-F4-Portable-Collector/*
          if-no-files-found: error
          retention-days: 90
      - name: Record the downloadable artifact digest
        shell: pwsh
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          "Source commit: $env:SOURCE_COMMIT" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Workflow run ID: $env:GITHUB_RUN_ID" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Downloadable artifact SHA-256: $env:ARTIFACT_DIGEST" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

