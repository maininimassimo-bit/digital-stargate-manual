name: Regenerate Scientific Catalog PR

on:
  push:
    branches:
      - fix/historical-session-coordinates
    paths:
      - '.github/workflows/regenerate-scientific-catalog-pr.yml'
      - '.github/scripts/generate-scientific-session-catalog.mjs'
      - 'data/analytics/metadata/session-scientific-metadata.csv'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/historical-session-coordinates
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate scientific session catalog
        run: |
          node .github/scripts/generate-scientific-session-catalog.mjs --write
          node .github/scripts/generate-scientific-session-catalog.mjs --check
      - name: Commit regenerated projection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/scientific-session-catalog.json
          if git diff --cached --quiet; then
            echo 'Catalog already aligned.'
            exit 0
          fi
          git commit -m 'chore(analytics): refresh governed session coordinates'
          git push origin HEAD:fix/historical-session-coordinates
