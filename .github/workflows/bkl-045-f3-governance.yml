name: BKL-045 F3 Governance

on:
  pull_request:
    paths:
      - 'docs/contracts/pixinsight-workflow-provenance.schema.json'
      - '.github/scripts/pixinsight-workflow-provenance.mjs'
      - '.github/scripts/test-pixinsight-workflow-provenance.mjs'
      - '.github/workflows/bkl-045-f3-governance.yml'
      - 'docs/architecture/scientific-assets/BKL-045-F3*'
      - 'tools/pixinsight/**'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/pixinsight-workflow-provenance.schema.json'
      - '.github/scripts/pixinsight-workflow-provenance.mjs'
      - '.github/scripts/test-pixinsight-workflow-provenance.mjs'
      - '.github/workflows/bkl-045-f3-governance.yml'
      - 'docs/architecture/scientific-assets/BKL-045-F3*'
      - 'tools/pixinsight/**'

permissions:
  contents: read

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sidecar schema JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/contracts/pixinsight-workflow-provenance.schema.json','utf8')); console.log('schema JSON OK')"
      - name: Test PixInsight workflow provenance contract
        run: node --test .github/scripts/test-pixinsight-workflow-provenance.mjs
      - name: Verify F3-B probe authority boundary
        shell: bash
        run: |
          set -euo pipefail
          probe='tools/pixinsight/DigitalStarGateProvenanceProbe.js'
          test -f "$probe"
          grep -q 'actionAuthority: "NONE"' "$probe"
          grep -q 'NO_OBSERVED_PROCESSING_STEP_IS_EMITTED_BY_THIS_PROBE' "$probe"
          grep -q 'completeness: steps.length > 0 ? "PARTIAL" : "UNAVAILABLE"' "$probe"
          if grep -Eq 'evidenceClass:[[:space:]]*"OBSERVED"' "$probe"; then
            echo 'F3-B bounded probe must not emit OBSERVED processing steps.' >&2
            exit 1
          fi
          echo 'F3-B bounded probe authority boundary OK'
