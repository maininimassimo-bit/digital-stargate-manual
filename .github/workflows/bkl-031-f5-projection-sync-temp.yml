name: BKL-031 F5 Acceptance Projection Sync

on:
  push:
    branches:
      - chore/bkl-031-f5-acceptance-reconciliation
    paths:
      - ".github/workflows/bkl-031-f5-projection-sync-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/bkl-031-f5-acceptance-reconciliation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate governed projections
        run: |
          node .github/scripts/generate-roadmap.mjs --write
          node .github/scripts/generate-scientific-platform-status.mjs --write
          node .github/scripts/generate-roadmap.mjs --check
          node .github/scripts/generate-scientific-platform-status.mjs --check
          node .github/scripts/verify-roadmap-consistency.mjs
      - name: Commit generated projections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/roadmap.json docs/data/scientific-platform-status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(gov): synchronize F5 acceptance projections"
          git push origin HEAD:chore/bkl-031-f5-acceptance-reconciliation
