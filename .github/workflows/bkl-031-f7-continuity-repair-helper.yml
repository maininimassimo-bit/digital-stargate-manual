name: BKL-031 F7 Continuity Repair Helper

on:
  push:
    branches:
      - chore/bkl-031-f7-acceptance-reconciliation
    paths:
      - '.github/scripts/repair-bkl031-f7-continuity.mjs'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair historical continuity assertions
        run: node .github/scripts/repair-bkl031-f7-continuity.mjs
      - name: Regenerate governed projections
        run: |
          node .github/scripts/generate-roadmap.mjs --write
          node .github/scripts/generate-scientific-platform-status.mjs --write
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts .github/roadmap docs/project/BACKLOG.md docs/data/roadmap.json docs/data/scientific-platform-status.json
          git commit -m "fix(bkl-031): preserve predecessor continuity through F8 promotion"
          git push origin HEAD:chore/bkl-031-f7-acceptance-reconciliation
