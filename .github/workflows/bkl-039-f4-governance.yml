name: BKL-039 F4 Governance

on:
  pull_request:
    paths:
      - 'docs/architecture/telemetry/BKL-039-F4-Equipment-Performance-Read-Only-Consumer-Contract.md'
      - 'docs/architecture/telemetry/BKL-039-F4B-Equipment-Performance-Portal-Projection.md'
      - 'docs/data/equipment-performance-registry-f4-read-model.json'
      - 'docs/equipment-performance/**'
      - 'docs/javascripts/equipment-performance.js'
      - 'docs/styles/equipment-performance.css'
      - 'schemas/equipment-performance-registry-f4-read-model.schema.json'
      - '.github/scripts/generate-equipment-performance-registry-f4-read-model.mjs'
      - '.github/scripts/verify-equipment-performance-registry-f4-read-model.mjs'
      - '.github/scripts/test-equipment-performance-registry-f4-read-model.mjs'
      - '.github/workflows/bkl-039-f4-governance.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/architecture/telemetry/BKL-039-F4-Equipment-Performance-Read-Only-Consumer-Contract.md'
      - 'docs/architecture/telemetry/BKL-039-F4B-Equipment-Performance-Portal-Projection.md'
      - 'docs/data/equipment-performance-registry-f4-read-model.json'
      - 'docs/equipment-performance/**'
      - 'docs/javascripts/equipment-performance.js'
      - 'docs/styles/equipment-performance.css'
      - 'schemas/equipment-performance-registry-f4-read-model.schema.json'
      - '.github/scripts/generate-equipment-performance-registry-f4-read-model.mjs'
      - '.github/scripts/verify-equipment-performance-registry-f4-read-model.mjs'
      - '.github/scripts/test-equipment-performance-registry-f4-read-model.mjs'
      - '.github/workflows/bkl-039-f4-governance.yml'

permissions:
  contents: read

jobs:
  f4-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify deterministic F4 read model
        run: node .github/scripts/generate-equipment-performance-registry-f4-read-model.mjs
      - name: Validate F4 fail-closed contract
        run: node .github/scripts/verify-equipment-performance-registry-f4-read-model.mjs
      - name: Run F4 negative regression suite
        run: node .github/scripts/test-equipment-performance-registry-f4-read-model.mjs
      - name: Guard browser authority and semantic boundary
        run: |
          grep -F "DSG.EquipmentPerformanceRegistry.F5.CollectionReadModel" docs/javascripts/equipment-performance.js
          grep -F "data.authority!=='projection'" docs/javascripts/equipment-performance.js
          grep -F "data.action_authority!=='NONE'" docs/javascripts/equipment-performance.js
          grep -F "v.unit==='NINA_FILENAME_FWHM_SOURCE_UNIT'" docs/javascripts/equipment-performance.js
          grep -F "v.unit_semantics==='SOURCE_NATIVE_UNCALIBRATED'" docs/javascripts/equipment-performance.js
          grep -F "v.angular_calibration_state==='NOT_PROVEN'" docs/javascripts/equipment-performance.js
          grep -F "v.measurements.length===v.measurement_count" docs/javascripts/equipment-performance.js
          grep -F "NO_EQUIPMENT_HEALTH_RANKING_THRESHOLD_OR_RECOMMENDATION" docs/javascripts/equipment-performance.js
          grep -F "HISTORICAL_READ_ONLY_PROJECTION_NOT_SAFETY_AUTHORITY" docs/javascripts/equipment-performance.js
