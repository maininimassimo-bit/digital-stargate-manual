name: BKL-031 F3-A3 Exact Platform Apply

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit authorized for the four-resource platform apply
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bkl-031-f3-a3-authenticated-platform-plan
  cancel-in-progress: false

jobs:
  exact-head-platform-apply:
    name: Exact-head four-resource saved-plan apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
      GCP_DATA_BUCKET: ${{ vars.GCP_DATA_BUCKET }}
      GCP_EVIDENCE_BUCKET: ${{ vars.GCP_EVIDENCE_BUCKET }}
      DSG_AUTHORIZED_COMMIT: ${{ inputs.expected_commit }}
      DSG_IMAGE_REFERENCE: europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike@sha256:de3331882e767c3a16fc479224da7c540385a6460e26df1ac73f8305676a0cce
      DSG_KERNEL_URI: gs://digital-stargate-telemetry-183451329061-f3-data/bkl-031/f3-a3/artifacts/spk/de442s/sha256/54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c/de442s.bsp
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_runtime_service_account_email: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TF_VAR_data_bucket_name: ${{ vars.GCP_DATA_BUCKET }}
      TF_VAR_evidence_bucket_name: ${{ vars.GCP_EVIDENCE_BUCKET }}
      TF_VAR_container_image_digest: europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike@sha256:de3331882e767c3a16fc479224da7c540385a6460e26df1ac73f8305676a0cce
      TF_VAR_kernel_artifact_sha256: 54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c
      TF_VAR_kernel_artifact_uri: gs://digital-stargate-telemetry-183451329061-f3-data/bkl-031/f3-a3/artifacts/spk/de442s/sha256/54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c/de442s.bsp
      TF_VAR_method_profile_sha256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
      TF_VAR_method_profile_path: /app/dsg/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
      TF_VAR_iers_artifact_sha256: 43786a0a9b60c7a55a85e12307c0050d75ea0679710378141255ded9d1bd8ebc
      TF_VAR_owner_decision_ref: BKL-031-F3-A3-F3-OD05-APPROVAL-2026-09-16
      TF_VAR_job_name: dsg-f3-a3-spike
      TF_VAR_subnet_cidr: 10.88.0.0/28
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require exact authorized main head and platform identities
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${DSG_AUTHORIZED_COMMIT}"
          grep -Eq '^[0-9a-f]{40}$' <<<"${GITHUB_SHA}"
          grep -Eq '^[0-9a-f]{40}$' <<<"${DSG_AUTHORIZED_COMMIT}"
          test "${GCP_PROJECT_ID}" = "digital-stargate-telemetry"
          test "${GCP_REGION}" = "europe-west8"
          test "${GCP_WIF_PROVIDER}" = "projects/183451329061/locations/global/workloadIdentityPools/dsg-f3-a3-github/providers/github-main"
          test "${GCP_DEPLOY_SERVICE_ACCOUNT}" = "dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com"
          test "${GCP_RUNTIME_SERVICE_ACCOUNT}" = "dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com"
          test "${GCP_STATE_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-state"
          test "${GCP_DATA_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-data"
          test "${GCP_EVIDENCE_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-evidence"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify immutable source and execution evidence
        env:
          DSG_METHOD_PROFILE_PATH: infrastructure/bkl-031-f3-a3-gcp/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
          DSG_METHOD_PROFILE_SHA256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
        run: |
          node .github/scripts/verify-bkl-031-f3-a3-method-profile.mjs
          node .github/scripts/verify-bkl-031-f3-a3-container-evidence.mjs
          node .github/scripts/verify-bkl-031-f3-a3-gcp-bootstrap.mjs
          node .github/scripts/verify-bkl-031-f3-a3-registry-foundation-verification.mjs
          node .github/scripts/verify-bkl-031-f3-a3-exact-oci-publication.mjs
          node .github/scripts/verify-bkl-031-f3-a3-platform-plan-gate.mjs
          node .github/scripts/verify-bkl-031-f3-a3-platform-apply-gate.mjs

      - name: Authenticate to Google Cloud through main-only WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "583.0.0"

      - name: Require exact published image, empty state and absent platform
        shell: bash
        run: |
          set -euo pipefail
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$active_account" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          gcloud artifacts docker images describe "$DSG_IMAGE_REFERENCE" --format=json >/tmp/published-image.json
          gcloud artifacts docker images list "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dsg-f3-a3" --include-tags --format=json >/tmp/images-before.json
          python - <<'PY'
          import json
          from pathlib import Path

          images = json.loads(Path("/tmp/images-before.json").read_text(encoding="utf-8"))
          if len(images) != 1:
              raise SystemExit(f"expected one published image, received {len(images)}")
          image = images[0]
          if image.get("package") != "europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike":
              raise SystemExit(f"unexpected package: {image!r}")
          if image.get("version") != "sha256:de3331882e767c3a16fc479224da7c540385a6460e26df1ac73f8305676a0cce":
              raise SystemExit(f"unexpected version: {image!r}")
          if image.get("tags") != ["candidate-3abc8aa04926"]:
              raise SystemExit(f"unexpected tags: {image!r}")
          PY
          state_uri="gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/default.tfstate"
          mapfile -t state_objects < <(gcloud storage ls "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/**")
          test "${#state_objects[@]}" -eq 1
          test "${state_objects[0]}" = "$state_uri"
          gcloud storage cat "$state_uri" >/tmp/platform-state-before.json
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("/tmp/platform-state-before.json").read_text(encoding="utf-8"))
          if state.get("outputs") != {} or state.get("resources") != [] or state.get("check_results") is not None:
              raise SystemExit("platform state is not empty before apply")
          PY
          set +e
          gcloud run jobs describe dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/tmp/unexpected-job.json 2>/tmp/job-before.err
          job_status=$?
          gcloud compute networks describe dsg-f3-a3-private --project="$GCP_PROJECT_ID" >/tmp/unexpected-network.json 2>/tmp/network-before.err
          network_status=$?
          gcloud compute networks subnets describe dsg-f3-a3-private-ew8 --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/tmp/unexpected-subnetwork.json 2>/tmp/subnetwork-before.err
          subnetwork_status=$?
          gcloud storage ls "$DSG_KERNEL_URI" >/tmp/unexpected-kernel.txt 2>/tmp/kernel-before.err
          kernel_status=$?
          set -e
          test "$job_status" -ne 0
          test "$network_status" -ne 0
          test "$subnetwork_status" -ne 0
          test "$kernel_status" -ne 0
          test ! -s /tmp/unexpected-kernel.txt
          grep -F "Cannot find job [dsg-f3-a3-spike]." /tmp/job-before.err
          grep -F "global/networks/dsg-f3-a3-private' was not found" /tmp/network-before.err
          grep -F "regions/${GCP_REGION}/subnetworks/dsg-f3-a3-private-ew8' was not found" /tmp/subnetwork-before.err
          grep -F "One or more URLs matched no objects." /tmp/kernel-before.err

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Create exact four-resource saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform init -reconfigure -input=false -backend-config="bucket=${GCP_STATE_BUCKET}" -backend-config="prefix=bkl-031/f3-a3/platform"
          set +e
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform plan -input=false -lock-timeout=60s -detailed-exitcode -out=/tmp/platform.tfplan
          plan_status=$?
          set -e
          test "$plan_status" -eq 2
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform show -no-color /tmp/platform.tfplan >/tmp/platform-plan.txt
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform show -json /tmp/platform.tfplan >/tmp/platform-plan.json

      - name: Verify exact saved plan before apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          expected_addresses = {
              "google_cloud_run_v2_job.spike",
              "google_cloud_run_v2_job_iam_member.deployer_invoker",
              "google_compute_network.spike",
              "google_compute_subnetwork.spike",
          }
          plan = json.loads(Path("/tmp/platform-plan.json").read_text(encoding="utf-8"))
          changes = plan.get("resource_changes", [])
          addresses = {change.get("address") for change in changes}
          if addresses != expected_addresses:
              raise SystemExit(f"unexpected plan addresses: {sorted(addresses)}")
          for change in changes:
              if change.get("change", {}).get("actions") != ["create"]:
                  raise SystemExit(f"unexpected action for {change.get('address')}: {change!r}")
          expected_variables = {
              "project_id": "digital-stargate-telemetry",
              "region": "europe-west8",
              "runtime_service_account_email": "dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com",
              "deployer_service_account_email": "dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com",
              "data_bucket_name": "digital-stargate-telemetry-183451329061-f3-data",
              "evidence_bucket_name": "digital-stargate-telemetry-183451329061-f3-evidence",
              "container_image_digest": os.environ["DSG_IMAGE_REFERENCE"],
              "kernel_artifact_sha256": "54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c",
              "kernel_artifact_uri": os.environ["DSG_KERNEL_URI"],
              "method_profile_sha256": "e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca",
              "method_profile_path": "/app/dsg/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json",
              "iers_artifact_sha256": "43786a0a9b60c7a55a85e12307c0050d75ea0679710378141255ded9d1bd8ebc",
              "owner_decision_ref": "BKL-031-F3-A3-F3-OD05-APPROVAL-2026-09-16",
              "job_name": "dsg-f3-a3-spike",
              "subnet_cidr": "10.88.0.0/28",
          }
          variables = plan.get("variables", {})
          for name, expected in expected_variables.items():
              if variables.get(name, {}).get("value") != expected:
                  raise SystemExit(f"unexpected variable {name}: {variables.get(name)!r}")
          digest = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"DSG_APPLY_PLAN_BINARY_SHA256={digest('/tmp/platform.tfplan')}\n")
              env.write(f"DSG_APPLY_PLAN_JSON_SHA256={digest('/tmp/platform-plan.json')}\n")
              env.write(f"DSG_APPLY_PLAN_TEXT_SHA256={digest('/tmp/platform-plan.txt')}\n")
          PY

      - name: Apply only the verified saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform apply -input=false -lock-timeout=60s /tmp/platform.tfplan

      - name: Verify exact state, cloud resources and zero executions
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform state list | sort >/tmp/platform-state-list.txt
          cat >/tmp/expected-state-list.txt <<'EOF'
          google_cloud_run_v2_job.spike
          google_cloud_run_v2_job_iam_member.deployer_invoker
          google_compute_network.spike
          google_compute_subnetwork.spike
          EOF
          diff -u /tmp/expected-state-list.txt /tmp/platform-state-list.txt
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform show -json >/tmp/platform-state-show.json
          gcloud compute networks describe dsg-f3-a3-private --project="$GCP_PROJECT_ID" --format=json >/tmp/network-after.json
          gcloud compute networks subnets describe dsg-f3-a3-private-ew8 --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/subnetwork-after.json
          gcloud run jobs describe dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/job-after.json
          gcloud run jobs get-iam-policy dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/job-iam-after.json
          gcloud run jobs executions list --job=dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/job-executions-after.json
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("/tmp/platform-state-show.json").read_text(encoding="utf-8"))
          resources = state.get("values", {}).get("root_module", {}).get("resources", [])
          addresses = {resource.get("address") for resource in resources}
          expected_addresses = {
              "google_cloud_run_v2_job.spike",
              "google_cloud_run_v2_job_iam_member.deployer_invoker",
              "google_compute_network.spike",
              "google_compute_subnetwork.spike",
          }
          if addresses != expected_addresses:
              raise SystemExit(f"unexpected applied state addresses: {sorted(addresses)}")

          network = json.loads(Path("/tmp/network-after.json").read_text(encoding="utf-8"))
          if network.get("name") != "dsg-f3-a3-private" or network.get("autoCreateSubnetworks") is not False:
              raise SystemExit(f"unexpected network: {network!r}")
          if network.get("routingConfig", {}).get("routingMode") != "REGIONAL":
              raise SystemExit(f"unexpected routing mode: {network!r}")

          subnet = json.loads(Path("/tmp/subnetwork-after.json").read_text(encoding="utf-8"))
          if subnet.get("name") != "dsg-f3-a3-private-ew8" or subnet.get("ipCidrRange") != "10.88.0.0/28":
              raise SystemExit(f"unexpected subnetwork: {subnet!r}")
          if subnet.get("privateIpGoogleAccess") is not True:
              raise SystemExit(f"private Google access is not enabled: {subnet!r}")

          job = json.loads(Path("/tmp/job-after.json").read_text(encoding="utf-8"))
          rendered_job = json.dumps(job, sort_keys=True)
          for value in [
              "dsg-f3-a3-spike",
              "europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike@sha256:de3331882e767c3a16fc479224da7c540385a6460e26df1ac73f8305676a0cce",
              "dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com",
              "SYNTHETIC_ONLY",
              "VALIDATION_SPIKE",
              "DENY",
          ]:
              if value not in rendered_job:
                  raise SystemExit(f"job does not contain required value {value}")
          labels = job.get("metadata", {}).get("labels", job.get("labels", {}))
          for name, expected in {"capability": "bkl-031", "increment": "f3-a3", "purpose": "validation-spike", "safety": "none"}.items():
              if labels.get(name) != expected:
                  raise SystemExit(f"unexpected job label {name}: {labels!r}")

          policy = json.loads(Path("/tmp/job-iam-after.json").read_text(encoding="utf-8"))
          bindings = policy.get("bindings", [])
          invokers = [binding for binding in bindings if binding.get("role") == "roles/run.invoker"]
          expected_member = "serviceAccount:dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com"
          if len(invokers) != 1 or invokers[0].get("members") != [expected_member]:
              raise SystemExit(f"unexpected invoker policy: {bindings!r}")

          executions = json.loads(Path("/tmp/job-executions-after.json").read_text(encoding="utf-8"))
          if executions != []:
              raise SystemExit(f"job execution occurred unexpectedly: {executions!r}")
          PY
          set +e
          gcloud storage ls "$DSG_KERNEL_URI" >/tmp/unexpected-kernel-after.txt 2>/tmp/kernel-after.err
          kernel_status=$?
          set -e
          test "$kernel_status" -ne 0
          test ! -s /tmp/unexpected-kernel-after.txt
          grep -F "One or more URLs matched no objects." /tmp/kernel-after.err

      - name: Require immediate zero drift
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform plan -input=false -lock-timeout=60s -detailed-exitcode -out=/tmp/platform-post-apply.tfplan
          plan_status=$?
          set -e
          test "$plan_status" -eq 0

      - name: Record bounded platform apply evidence
        shell: bash
        run: |
          set -euo pipefail
          state_uri="gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/default.tfstate"
          mapfile -t state_objects < <(gcloud storage ls "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/**")
          test "${#state_objects[@]}" -eq 1
          test "${state_objects[0]}" = "$state_uri"
          gcloud storage cat "$state_uri" >/tmp/platform-state-raw.json
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          state_path = Path("/tmp/platform-state-raw.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("version") != 4 or state.get("terraform_version") != "1.16.2":
              raise SystemExit("unexpected Terraform state format")
          if not isinstance(state.get("serial"), int) or state["serial"] < 2:
              raise SystemExit(f"unexpected state serial: {state.get('serial')!r}")
          if not re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", state.get("lineage", "")):
              raise SystemExit(f"unexpected state lineage: {state.get('lineage')!r}")
          if len(state.get("resources", [])) != 4:
              raise SystemExit(f"unexpected raw state resource count: {len(state.get('resources', []))}")
          evidence = {
              "evidenceId": "BKL-031-F3-A3-PLATFORM-APPLY-EVIDENCE",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "imageReference": os.environ["DSG_IMAGE_REFERENCE"],
              "planBinarySha256": os.environ["DSG_APPLY_PLAN_BINARY_SHA256"],
              "planJsonSha256": os.environ["DSG_APPLY_PLAN_JSON_SHA256"],
              "planTextSha256": os.environ["DSG_APPLY_PLAN_TEXT_SHA256"],
              "resourceActions": {"add": 4, "change": 0, "destroy": 0},
              "resourceAddresses": [
                  "google_cloud_run_v2_job.spike",
                  "google_cloud_run_v2_job_iam_member.deployer_invoker",
                  "google_compute_network.spike",
                  "google_compute_subnetwork.spike",
              ],
              "terraformStateUri": "gs://digital-stargate-telemetry-183451329061-f3-state/bkl-031/f3-a3/platform/default.tfstate",
              "terraformStateRawSha256": hashlib.sha256(state_path.read_bytes()).hexdigest(),
              "terraformStateSerial": state["serial"],
              "terraformStateLineage": state["lineage"],
              "postApplyDrift": 0,
              "jobExecutionCount": 0,
              "kernelArtifact": "NOT_UPLOADED",
              "artifactUpload": "NOT_EXECUTED",
              "scientificExecution": "NOT_EXECUTED",
              "externalReferenceTraffic": "NOT_EXECUTED",
              "protectedSiteUse": "NOT_EXECUTED",
              "runtimeActivation": "NOT_EXECUTED",
              "runtimeAuthority": False,
          }
          rendered = json.dumps(evidence, indent=2, sort_keys=True)
          print("BKL031_PLATFORM_APPLY_EVIDENCE_BEGIN")
          print(rendered)
          print("BKL031_PLATFORM_APPLY_EVIDENCE_END")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## BKL-031 F3-A3 platform apply evidence\n\n```json\n" + rendered + "\n```\n",
              encoding="utf-8",
          )
          PY
