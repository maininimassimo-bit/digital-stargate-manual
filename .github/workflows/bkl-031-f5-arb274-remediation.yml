name: BKL-031 F5 ARB-274-M01 Remediation

on:
  push:
    branches:
      - chore/bkl-031-f5-acceptance-reconciliation
    paths:
      - '.github/workflows/bkl-031-f5-arb274-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/bkl-031-f5-acceptance-reconciliation
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct F5 acceptance milestone and strengthen verifier
        run: |
          node <<'NODE'
          const fs = require('fs');
          const roadmapPath = '.github/roadmap/roadmap-source.json';
          const roadmap = JSON.parse(fs.readFileSync(roadmapPath, 'utf8'));
          const milestone = roadmap.milestones.find((entry) => entry.id === 'M-BKL031-F5-ACCEPTANCE');
          if (!milestone) throw new Error('M-BKL031-F5-ACCEPTANCE missing');
          milestone.description = 'PR #273 passed exact-head governance on dfda963e7e9d088282516200a6bd8bb64dd0dd1d, merged with expected-head control as 777924e2638430f15bf717fa33dd71057751625a and passed all 7 applicable post-merge workflows. The deterministic EVALUATION/NONE/READ_ONLY ranking method, synthetic validation fixture and read-only consumer are Accepted/Post-Merge Verified. Provider budget remains 2/2 exhausted; F6 real-evidence setup-aware E2E planner integration is next and BKL-031 capability closure remains deferred pending a separately governed forecast-refresh/runtime gate.';
          fs.writeFileSync(roadmapPath, JSON.stringify(roadmap, null, 2) + '\n');

          const verifierPath = '.github/scripts/verify-observation-planner-ranking-f5.mjs';
          let verifier = fs.readFileSync(verifierPath, 'utf8');
          const marker = "assert.ok(roadmap.milestones.some(entry=>entry.id==='M-BKL031-F5-ACCEPTANCE'),'roadmap F5 acceptance milestone missing');";
          if (!verifier.includes(marker)) throw new Error('F5 milestone verifier marker missing');
          const insertion = `${marker}\nconst f5AcceptanceMilestone=roadmap.milestones.find(entry=>entry.id==='M-BKL031-F5-ACCEPTANCE');\nassert.ok(f5AcceptanceMilestone.description.includes('F6 real-evidence setup-aware E2E planner integration is next'),'F5 acceptance milestone must promote F6 real-evidence setup-aware E2E planner');\nassert.ok(f5AcceptanceMilestone.description.includes('capability closure remains deferred'),'F5 acceptance milestone must preserve deferred BKL-031 closure');\nassert.ok(!f5AcceptanceMilestone.description.includes('F6 capability closure is next'),'F5 acceptance milestone must not re-authorize early capability closure');`;
          verifier = verifier.replace(marker, insertion);
          fs.writeFileSync(verifierPath, verifier);
          NODE
      - name: Regenerate governed projections
        run: |
          node .github/scripts/generate-roadmap.mjs --write
          node .github/scripts/generate-scientific-platform-status.mjs --write
      - name: Verify remediation
        run: |
          node .github/scripts/generate-roadmap.mjs --check
          node .github/scripts/generate-scientific-platform-status.mjs --check
          node .github/scripts/verify-roadmap-consistency.mjs
          node .github/scripts/verify-observation-planner-ranking-f5.mjs
      - name: Commit remediation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/roadmap/roadmap-source.json \
            .github/scripts/verify-observation-planner-ranking-f5.mjs \
            docs/data/roadmap.json \
            docs/data/scientific-platform-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(bkl-031): defer closure in F5 acceptance milestone'
          git push origin HEAD:chore/bkl-031-f5-acceptance-reconciliation
