name: AP-013C Verified Transport Cleanup

on:
  pull_request:
    paths:
      - "tools/dsdm/session-importer/**"
      - "docs/architecture/packages/AP-013C-Verified-Transport-Cleanup-and-Convergence-Monitoring.md"
      - "docs/architecture/scientific-assets/DSDM-005-Verified-Transport-Cleanup-Solution-Design.md"
      - "docs/architecture/validation/AP-013C-Dry-Run-and-Failure-Injection-Acceptance-Plan.md"
      - ".github/workflows/ap-013c-verified-transport-cleanup.yml"
  push:
    branches:
      - main
    paths:
      - "tools/dsdm/session-importer/**"
      - ".github/workflows/ap-013c-verified-transport-cleanup.yml"

permissions:
  contents: read

jobs:
  pester:
    name: AP-013C Pester
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure Pester 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pester = Get-Module Pester -ListAvailable | Where-Object { $_.Version.Major -ge 5 } | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $pester) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          }
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          Write-Host "Pester version: $((Get-Module Pester).Version)"

      - name: Run AP-013C contract and failure-injection tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            '.\tools\dsdm\session-importer\tests\DSG.OneDriveTransport.Tests.ps1',
            '.\tools\dsdm\session-importer\tests\DSG.VerifiedTransportCleanup.Tests.ps1',
            '.\tools\dsdm\session-importer\tests\Start-DSGOneDriveImport.Ack.Tests.ps1',
            '.\tools\dsdm\session-importer\tests\DSG.VerifiedTransportCleanup.FailureInjection.Tests.ps1'
          )
          $result = Invoke-Pester -Path $paths -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) {
            throw "AP-013C Pester failures: $($result.FailedCount)"
          }
          Write-Host "AP-013C tests passed: $($result.PassedCount); failed: $($result.FailedCount); skipped: $($result.SkippedCount)"
