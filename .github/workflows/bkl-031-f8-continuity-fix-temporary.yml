name: BKL-031 F8 Continuity Fix Temporary

on:
  push:
    branches:
      - chore/bkl-031-f8-acceptance-reconciliation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[f8-continuity-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/bkl-031-f8-acceptance-reconciliation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve historical acceptance markers and current F9 pointer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          backlog = Path('docs/project/BACKLOG.md')
          s = backlog.read_text()
          lines = s.splitlines()
          i = next((i for i,l in enumerate(lines) if l.startswith('| BKL-031 |')), None)
          if i is None:
              raise SystemExit('BKL-031 row not found')
          lines[i] = '| BKL-031 | P1 | Observation Planner intelligente | In Progress | BKL-035; BKL-040; BKL-037; F3-C Accepted/Post-Merge Verified; F4-A/ADR-011; F4-B v1.1 Accepted/Post-Merge Verified; F4-C evidence reconciliation Accepted/Post-Merge Verified; F4-D metadata-only projection and portal Accepted/Post-Merge Verified; F5/F6/F7/F8 Accepted/Post-Merge Verified; provider budget 2/2 exhausted; F7 protected-site one-shot budget 1/1 exhausted; F8 PR #279 merge `20669f7164460297d7318fc3b5874e4bc7f4bcde`; S10 unavailable | Execute F9 repeatable current-night planner closure: governed fresh forecast supply + current astronomy + explicit OTA/camera/filter suitability + explainable portal ranking/windows. Preserve privacy/freshness fail-closed, BKL-032 readiness separation and local physical-interlock Safety Authority. Recurring provider traffic requires separate authority/budget decision. | F8 acceptance 17/09/2026; PR #279; `BKL-031-F8-CURRENT-ASTRONOMY-SETUP-SUITABILITY-ACCEPTANCE-2026-09-17.md` |'
          backlog.write_text('\n'.join(lines) + '\n')

          rp = Path('.github/roadmap/roadmap-source.json')
          r = json.loads(rp.read_text())
          r['projectStatus'] = 'BKL-031 continuity: F3-C accepted and post-merge verified; F4-A/ADR-011 Accepted/Post-Merge Verified; F4-B v1.1 Accepted/Post-Merge Verified; F4-C evidence reconciliation Accepted/Post-Merge Verified; F4-D sanitized forecast projection/portal Accepted/Post-Merge Verified; F5 explainable ranking Accepted/Post-Merge Verified; F6 real-evidence setup-aware E2E Accepted/Post-Merge Verified; F7 fresh protected-site forecast supply Accepted/Post-Merge Verified; F8 current astronomy and explicit setup suitability Accepted/Post-Merge Verified via PR #279 merge 20669f7164460297d7318fc3b5874e4bc7f4bcde; F4-C provider budget 2/2 exhausted; F7 protected-site budget 1/1 exhausted; recurring provider traffic not authorized; BKL-031 remains In Progress; S10 production runtime unavailable; no readiness/go-no-go, scheduling, automatic target selection, commands or Safety Authority.'
          rp.write_text(json.dumps(r, indent=2) + '\n')
          PY
      - name: Regenerate governed projections
        run: |
          node .github/scripts/generate-roadmap.mjs --write
          node .github/scripts/generate-scientific-platform-status.mjs --write
      - name: Remove temporary workflow and commit
        run: |
          git rm -f .github/workflows/bkl-031-f8-continuity-fix-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix(bkl-031): preserve predecessor continuity while promoting F9 [f8-continuity-fixed]"
          git push origin HEAD:chore/bkl-031-f8-acceptance-reconciliation
