name: BKL-043 F4 Night Candidate Offline Validation
on:
  pull_request:
    paths:
      - 'infrastructure/bkl043-f4-night-acceptance/**'
      - '.github/workflows/bkl-043-f4-night-candidate-validation.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell and immutable collector hash
        shell: powershell
        run: |
          $root = 'infrastructure/bkl043-f4-night-acceptance'
          Get-ChildItem $root -Filter '*.ps1' | ForEach-Object {
            $tokens=$null; $errors=$null
            [Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw 'POWERSHELL_PARSE_FAILED'}
          }
          $manifest=Get-Content "$root/manifest.json" -Raw | ConvertFrom-Json
          if((Get-FileHash "$root/Start-BKL043-F4Pilot.ps1" -Algorithm SHA256).Hash -ne $manifest.collector_sha256){throw 'HASH_MISMATCH'}
      - name: Exercise selected collector functions without runtime
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -File infrastructure/bkl043-f4-night-acceptance/Test-CollectorFunctions.ps1
          if($LASTEXITCODE -ne 0){throw 'COLLECTOR_TEST_FAILED'}
      - name: Exercise deadline and blocked native child in isolation
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -File infrastructure/bkl043-f4-night-acceptance/Test-WindowSupervisor.ps1
          if($LASTEXITCODE -ne 0){throw 'SUPERVISOR_TEST_FAILED'}
      - name: Exercise task result and heartbeat observation regressions
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -File infrastructure/bkl043-f4-night-acceptance/Test-TaskResults.ps1
          if($LASTEXITCODE -ne 0){throw 'TASK_REGRESSION_FAILED'}
          & powershell.exe -NoLogo -NoProfile -File infrastructure/bkl043-f4-night-acceptance/Test-HeartbeatObservation.ps1
          if($LASTEXITCODE -ne 0){throw 'HEARTBEAT_REGRESSION_FAILED'}
      - name: Exercise isolated real filesystem without cloud or EAGLE
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -File infrastructure/bkl043-f4-night-acceptance/Test-IsolatedFilesystem.ps1
          if($LASTEXITCODE -ne 0){throw 'ISOLATED_FILESYSTEM_FAILED'}
