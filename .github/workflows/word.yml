name: Genera manuale Word

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-word:
    runs-on: windows-latest

    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Installa Pandoc con retry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (Get-Command pandoc -ErrorAction SilentlyContinue) {
            pandoc --version
            exit 0
          }

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Tentativo $attempt di $maxAttempts per installare Pandoc..."
            choco install pandoc -y --no-progress

            if (Get-Command pandoc -ErrorAction SilentlyContinue) {
              pandoc --version
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          throw 'Pandoc non disponibile dopo 3 tentativi di installazione.'

      - name: Genera documento Word
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Carica documento generato
        uses: actions/upload-artifact@v4
        with:
          name: DSG-TM-001-Word
          path: release/DSG-TM-001_Digital_StarGate_Master.docx
