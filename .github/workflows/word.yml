name: Genera manuale Word

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/word.yml'
      - 'build.ps1'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-word:
    runs-on: windows-latest

    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Installa Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.8.3'

      - name: Verifica Pandoc
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pandoc = Get-Command pandoc -ErrorAction Stop
          Write-Host "Pandoc disponibile: $($pandoc.Source)"
          pandoc --version
          if ($LASTEXITCODE -ne 0) {
            throw 'La verifica di Pandoc non e riuscita.'
          }

      - name: Genera documento Word
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Carica documento generato
        uses: actions/upload-artifact@v4
        with:
          name: DSG-TM-001-Word
          path: release/DSG-TM-001_Digital_StarGate_Master.docx
