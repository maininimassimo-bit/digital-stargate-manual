name: BKL-031 F6 Candidate Reconciliation

on:
  push:
    branches: [feat/bkl-031-f6-real-evidence-setup-aware-e2e]
    paths:
      - ".github/scripts/reconcile-bkl031-f6-candidate.mjs"
      - ".github/workflows/bkl-031-f6-candidate-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/bkl-031-f6-real-evidence-setup-aware-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile F6 candidate navigation and project index
        run: node .github/scripts/reconcile-bkl031-f6-candidate.mjs
      - name: Commit reconciled candidate state when changed
        shell: bash
        run: |
          if git diff --quiet -- mkdocs.yml docs/project/index.md; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mkdocs.yml docs/project/index.md
          git commit -m "docs(bkl-031): reconcile F6 candidate navigation"
          git push origin HEAD:feat/bkl-031-f6-real-evidence-setup-aware-e2e
