name: Validate Session Comparison Projection

on:
  pull_request:
    paths:
      - '.github/scripts/generate-session-comparison-projection.mjs'
      - '.github/scripts/session-comparison-read-model.mjs'
      - '.github/scripts/session-comparison-projection.mjs'
      - '.github/scripts/test-generate-session-comparison-projection.mjs'
      - '.github/workflows/analyze-session-automatic.yml'
      - '.github/workflows/session-comparison-validation.yml'
      - 'docs/data/scientific-session-catalog.json'
      - 'docs/data/session-comparison-projection.json'
      - 'docs/javascripts/session-comparison.js'
      - 'docs/session-comparison/**'
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate-session-comparison-projection.mjs'
      - '.github/scripts/session-comparison-read-model.mjs'
      - '.github/scripts/session-comparison-projection.mjs'
      - '.github/scripts/test-generate-session-comparison-projection.mjs'
      - '.github/workflows/analyze-session-automatic.yml'
      - '.github/workflows/session-comparison-validation.yml'
      - 'docs/data/scientific-session-catalog.json'
      - 'docs/data/session-comparison-projection.json'
      - 'docs/javascripts/session-comparison.js'
      - 'docs/session-comparison/**'

permissions: { contents: read }

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Test dynamic comparison generator
        run: node --test .github/scripts/test-generate-session-comparison-projection.mjs
      - name: Verify persisted projection matches full scientific catalog
        run: node .github/scripts/generate-session-comparison-projection.mjs --check
      - name: Test canonical comparison read model
        run: node --test .github/scripts/test-session-comparison-read-model.mjs
      - name: Test canonical comparison projection
        run: node --test .github/scripts/test-session-comparison-projection.mjs
