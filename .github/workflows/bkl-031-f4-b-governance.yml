name: BKL-031 F4-B Governance

on:
  pull_request:
    paths:
      - ".github/scripts/*observation-planner-forecast-f4b*"
      - ".github/workflows/bkl-031-f4-b-governance.yml"
      - ".github/workflows/developer-foundation.yml"
      - "schemas/observation-planner-forecast-*-f4b.schema.json"
      - "docs/data/observation-planner-forecast-f4b-fixture.json"
      - "docs/architecture/scientific-assets/BKL-031-F4-B-*.md"
      - "docs/project/BACKLOG.md"
      - "docs/project/REPOSITORY_KNOWLEDGE_MAP.md"
      - "docs/project/index.md"
      - ".github/roadmap/roadmap-source.json"
      - "docs/data/roadmap.json"
      - "docs/data/scientific-platform-status.json"
      - "mkdocs.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/*observation-planner-forecast-f4b*"
      - ".github/workflows/bkl-031-f4-b-governance.yml"
      - ".github/workflows/developer-foundation.yml"
      - "schemas/observation-planner-forecast-*-f4b.schema.json"
      - "docs/data/observation-planner-forecast-f4b-fixture.json"
      - "docs/architecture/scientific-assets/BKL-031-F4-B-*.md"
      - "docs/project/BACKLOG.md"
      - "docs/project/REPOSITORY_KNOWLEDGE_MAP.md"
      - "docs/project/index.md"
      - ".github/roadmap/roadmap-source.json"
      - "docs/data/roadmap.json"
      - "docs/data/scientific-platform-status.json"
      - "mkdocs.yml"

permissions:
  contents: read

jobs:
  contracts-and-validator:
    name: F4-B contracts, synthetic fixture and fail-closed validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node .github/scripts/verify-observation-planner-forecast-f4b.mjs
      - run: node --test .github/scripts/test-observation-planner-forecast-f4b.mjs
