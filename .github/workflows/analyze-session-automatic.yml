name: Analyze Observatory Session Automatically
on:
  push:
    branches: [main]
    paths:
      - "data/sessions/**/manifest.json"
  workflow_dispatch:
    inputs:
      session_id:
        description: "Session ID YYYY-MM-DD_YYYY-MM-DD"
        required: true
        type: string
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    concurrency:
      group: dsg-session-analytics
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Resolve session
        id: resolve
        shell: bash
        env:
          MANUAL_ID: ${{ github.event.inputs.session_id }}
        run: |
          set -euo pipefail
          id="$(printf '%s' "${MANUAL_ID:-}" | xargs)"
          if [[ -z "$id" ]]; then
            manifest="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^data/sessions/[0-9]{4}/[0-9]{2}/[^/]+/manifest\.json$' | head -n1 || true)"
            test -n "$manifest" || { echo "Manifest non individuato."; exit 1; }
            id="$(basename "$(dirname "$manifest")")"
          fi
          [[ "$id" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Session ID non valido: $id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "year=${id:0:4}" >> "$GITHUB_OUTPUT"
          echo "month=${id:5:2}" >> "$GITHUB_OUTPUT"
      - name: Analyze, report and update history
        shell: bash
        run: |
          set -euo pipefail
          id="${{ steps.resolve.outputs.id }}"
          year="${{ steps.resolve.outputs.year }}"
          month="${{ steps.resolve.outputs.month }}"
          session="data/sessions/$year/$month/$id"
          metrics="$session/normalized/session-metrics.json"
          report_dir="docs/session-reports/$year/$month/$id"
          python dsg-analytics/analyzer/analyze_session.py --session "$session"
          mkdir -p "$report_dir"
          python dsg-analytics/reporter/generate_markdown_report.py --metrics "$metrics" --output "$report_dir/report-sessione.md"
          python dsg-analytics/reporter/generate_pdf_report.py --metrics "$metrics" --output "$report_dir/Report_Sessione_$id.pdf"
          python dsg-analytics/history/update_history.py --metrics "$metrics" --history "data/analytics/history/sessions.csv"
      - name: Commit generated analytics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Digital StarGate Bot"
          git config user.email "digital-stargate-bot@users.noreply.github.com"
          git add data/sessions data/analytics docs/session-reports
          if git diff --cached --quiet; then
            echo "Nessun risultato nuovo."
            exit 0
          fi
          git commit -m "Analyze observatory session ${{ steps.resolve.outputs.id }}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 20
          done
          echo "Push risultati non riuscito."
          exit 1
