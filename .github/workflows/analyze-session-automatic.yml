name: Analyze Observatory Session Automatically

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/sessions/**/manifest.json'

permissions:
  contents: write

concurrency:
  group: scientific-analytics-projection-main
  cancel-in-progress: false

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate complete session packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifests = Get-ChildItem data/sessions -Filter manifest.json -Recurse
          if (-not $manifests) { throw 'No session manifest found.' }
          foreach ($manifestFile in $manifests) {
            $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
            if ([string]$manifest.report_status -ne 'COMPLETE') {
              throw "Session package is not COMPLETE: $($manifest.session_id)"
            }
            $root = Split-Path $manifestFile.FullName
            foreach ($required in @('raw/nina','raw/phd2','raw/weather')) {
              $requiredPath = Join-Path $root $required
              if (-not (Test-Path $requiredPath -PathType Container)) {
                throw "Missing evidence directory: $required in $root"
              }
              if (-not (Get-ChildItem $requiredPath -File -Recurse | Select-Object -First 1)) {
                throw "Missing evidence files: $required in $root"
              }
            }
          }

      - name: Analyze sessions
        run: python dsg-analytics/analyzer/analyze_session.py

      - name: Update analytics history
        run: python dsg-analytics/history/update_history.py

      - name: Consolidate analytics history
        run: python dsg-analytics/history/consolidate_history.py

      - name: Rebuild target exposure projection
        run: python dsg-analytics/target/extract_target_metrics.py --repo-root .

      - name: Rebuild target aggregate projection
        run: python dsg-analytics/target/build_targets.py --repo-root .

      - name: Rebuild scientific session catalog
        run: node .github/scripts/generate-scientific-session-catalog.mjs --write

      - name: Rebuild scientific observation index
        run: node .github/scripts/generate-scientific-catalog.mjs --write

      - name: Verify deterministic projections
        run: |
          node .github/scripts/generate-scientific-session-catalog.mjs --check
          node .github/scripts/generate-scientific-catalog.mjs --check

      - name: Commit versioned analytics and catalog projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/analytics data/sessions docs/data/scientific-session-catalog.json docs/data/scientific-observation-index.json
          if git diff --cached --quiet; then
            echo 'No analytics or catalog changes to publish.'
            exit 0
          fi
          git commit -m 'chore(analytics): refresh scientific projections'
          git push origin HEAD:main
