name: BKL-031 F3-A3 Authenticated Platform Plan

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit authorized for the authenticated plan
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bkl-031-f3-a3-authenticated-platform-plan
  cancel-in-progress: false

jobs:
  exact-head-plan:
    name: Exact-head candidate image and authenticated plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
      GCP_DATA_BUCKET: ${{ vars.GCP_DATA_BUCKET }}
      GCP_EVIDENCE_BUCKET: ${{ vars.GCP_EVIDENCE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require exact authorized main head and bootstrap identities
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${{ inputs.expected_commit }}"
          grep -Eq '^[0-9a-f]{40}$' <<<"${GITHUB_SHA}"
          test "${GCP_PROJECT_ID}" = "digital-stargate-telemetry"
          test "${GCP_REGION}" = "europe-west8"
          test "${GCP_WIF_PROVIDER}" = "projects/183451329061/locations/global/workloadIdentityPools/dsg-f3-a3-github/providers/github-main"
          test "${GCP_DEPLOY_SERVICE_ACCOUNT}" = "dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com"
          test "${GCP_RUNTIME_SERVICE_ACCOUNT}" = "dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com"
          test "${GCP_STATE_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-state"
          test "${GCP_DATA_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-data"
          test "${GCP_EVIDENCE_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-evidence"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify immutable repository contracts
        env:
          DSG_METHOD_PROFILE_PATH: infrastructure/bkl-031-f3-a3-gcp/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
          DSG_METHOD_PROFILE_SHA256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
        run: |
          node .github/scripts/verify-bkl-031-f3-a3-method-profile.mjs
          node .github/scripts/verify-bkl-031-f3-a3-container-evidence.mjs
          node .github/scripts/verify-bkl-031-f3-a3-gcp-bootstrap.mjs
          node .github/scripts/verify-bkl-031-f3-a3-platform-plan-gate.mjs

      - name: Acquire only reviewed wheels and verify exact bytes
        run: >-
          node .github/scripts/acquire-bkl-031-f3-a3-container-artifacts.mjs
          --destination infrastructure/bkl-031-f3-a3-gcp/container/.build/wheels
          --evidence infrastructure/bkl-031-f3-a3-gcp/container/.build/acquisition-evidence.json

      - name: Pull reviewed base and BuildKit platform digests
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 python:3.12.14-slim-bookworm@sha256:9c47360a2a0355e2da18516d0b1c2126ec22c195d2185e97347c9d98398c5bef
          buildkit_image='moby/buildkit:v0.30.0@sha256:57269d1784e49b46228c45a1a1b870fbe40e0a639ab60b37b032d83af5bccdfc'
          docker pull --platform linux/amd64 "$buildkit_image"
          docker buildx create --name dsg-plan-repro --driver docker-container --driver-opt "image=$buildkit_image" --use
          docker buildx inspect --bootstrap

      - name: Produce two identical unpublished OCI candidates
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=0
          for candidate in a b; do
            output="type=oci,dest=/tmp/dsg-candidate-${candidate}.tar,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30"
            docker buildx build --builder dsg-plan-repro --platform linux/amd64 --network=none --pull=false --no-cache --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 --metadata-file "/tmp/dsg-candidate-${candidate}.json" --output "$output" --file infrastructure/bkl-031-f3-a3-gcp/container/Dockerfile infrastructure/bkl-031-f3-a3-gcp
          done
          digest_a="$(jq -er '."containerimage.digest"' /tmp/dsg-candidate-a.json)"
          digest_b="$(jq -er '."containerimage.digest"' /tmp/dsg-candidate-b.json)"
          config_a="$(jq -er '."containerimage.config.digest"' /tmp/dsg-candidate-a.json)"
          config_b="$(jq -er '."containerimage.config.digest"' /tmp/dsg-candidate-b.json)"
          test "$digest_a" = "$digest_b"
          test "$config_a" = "$config_b"
          test "$config_a" = "sha256:411df908f3938e0ff21b47986d4d5d9fcd91e1d0da3b64ffb00618aa48bbd5d0"
          grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$digest_a"
          candidate_repository="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dsg-f3-a3/spike"
          candidate_reference="${candidate_repository}@${digest_a}"
          printf 'candidate-manifest-a=%s\ncandidate-manifest-b=%s\nconfig-a=%s\nconfig-b=%s\n' "$digest_a" "$digest_b" "$config_a" "$config_b"
          echo "DSG_CANDIDATE_MANIFEST_DIGEST=$digest_a" >> "$GITHUB_ENV"
          echo "DSG_CANDIDATE_IMAGE_REFERENCE=$candidate_reference" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud through main-only WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "583.0.0"

      - name: Verify federated identity and absent platform resources
        shell: bash
        run: |
          set -euo pipefail
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$active_account" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          gcloud storage buckets describe "gs://${GCP_STATE_BUCKET}" >/tmp/state-bucket.json
          set +e
          gcloud artifacts repositories describe dsg-f3-a3 --project="$GCP_PROJECT_ID" --location="$GCP_REGION" >/tmp/unexpected-repository.json 2>/tmp/repository-describe.err
          repository_status=$?
          gcloud run jobs describe dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/tmp/unexpected-job.json 2>/tmp/job-describe.err
          job_status=$?
          gcloud compute networks describe dsg-f3-a3-private --project="$GCP_PROJECT_ID" >/tmp/unexpected-network.json 2>/tmp/network-describe.err
          network_status=$?
          gcloud compute networks subnets describe dsg-f3-a3-private-ew8 --project="$GCP_PROJECT_ID" --region="$GCP_REGION" >/tmp/unexpected-subnetwork.json 2>/tmp/subnetwork-describe.err
          subnetwork_status=$?
          set -e
          test "$repository_status" -ne 0
          test "$job_status" -ne 0
          test "$network_status" -ne 0
          test "$subnetwork_status" -ne 0
          grep -F "NOT_FOUND" /tmp/repository-describe.err
          grep -F "NOT_FOUND" /tmp/job-describe.err
          grep -F "NOT_FOUND" /tmp/network-describe.err
          grep -F "NOT_FOUND" /tmp/subnetwork-describe.err

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Create authenticated saved plan without apply
        shell: bash
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_runtime_service_account_email: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          TF_VAR_data_bucket_name: ${{ vars.GCP_DATA_BUCKET }}
          TF_VAR_evidence_bucket_name: ${{ vars.GCP_EVIDENCE_BUCKET }}
          TF_VAR_kernel_artifact_sha256: 54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c
          TF_VAR_kernel_artifact_uri: gs://digital-stargate-telemetry-183451329061-f3-data/bkl-031/f3-a3/artifacts/spk/de442s/sha256/54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c/de442s.bsp
          TF_VAR_method_profile_sha256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
          TF_VAR_method_profile_path: /app/dsg/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
          TF_VAR_iers_artifact_sha256: 43786a0a9b60c7a55a85e12307c0050d75ea0679710378141255ded9d1bd8ebc
          TF_VAR_owner_decision_ref: BKL-031-F3-A3-F3-OD05-APPROVAL-2026-09-16
        run: |
          set -euo pipefail
          export TF_VAR_container_image_digest="$DSG_CANDIDATE_IMAGE_REFERENCE"
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform init -reconfigure -input=false -backend-config="bucket=${GCP_STATE_BUCKET}" -backend-config="prefix=bkl-031/f3-a3/platform"
          set +e
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform plan -input=false -lock-timeout=60s -detailed-exitcode -out=/tmp/platform.tfplan
          plan_status=$?
          set -e
          test "$plan_status" -eq 2
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform show -no-color /tmp/platform.tfplan | tee /tmp/platform-plan.txt
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform show -json /tmp/platform.tfplan > /tmp/platform-plan.json

      - name: Verify exact plan and record review evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          expected_addresses = {
              "google_artifact_registry_repository.spike",
              "google_compute_network.spike",
              "google_compute_subnetwork.spike",
              "google_cloud_run_v2_job.spike",
              "google_cloud_run_v2_job_iam_member.deployer_invoker",
          }
          plan_path = Path("/tmp/platform.tfplan")
          text_path = Path("/tmp/platform-plan.txt")
          json_path = Path("/tmp/platform-plan.json")
          plan = json.loads(json_path.read_text(encoding="utf-8"))
          changes = plan.get("resource_changes", [])
          addresses = {change["address"] for change in changes}
          if addresses != expected_addresses:
              raise SystemExit(f"unexpected plan addresses: {sorted(addresses)}")
          for change in changes:
              if change.get("change", {}).get("actions") != ["create"]:
                  raise SystemExit(f"non-create action for {change['address']}: {change.get('change', {}).get('actions')}")
          variables = plan.get("variables", {})
          expected_variables = {
              "project_id": "digital-stargate-telemetry",
              "region": "europe-west8",
              "runtime_service_account_email": "dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com",
              "deployer_service_account_email": "dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com",
              "data_bucket_name": "digital-stargate-telemetry-183451329061-f3-data",
              "evidence_bucket_name": "digital-stargate-telemetry-183451329061-f3-evidence",
              "container_image_digest": os.environ["DSG_CANDIDATE_IMAGE_REFERENCE"],
          }
          for name, expected in expected_variables.items():
              actual = variables.get(name, {}).get("value")
              if actual != expected:
                  raise SystemExit(f"unexpected variable {name}: {actual!r}")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          evidence = {
              "evidenceId": "BKL-031-F3-A3-AUTHENTICATED-PLATFORM-PLAN-EVIDENCE",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "candidateImageReference": os.environ["DSG_CANDIDATE_IMAGE_REFERENCE"],
              "candidateManifestDigest": os.environ["DSG_CANDIDATE_MANIFEST_DIGEST"],
              "candidateConfigDigest": "sha256:411df908f3938e0ff21b47986d4d5d9fcd91e1d0da3b64ffb00618aa48bbd5d0",
              "planBinarySha256": digest(plan_path),
              "planTextSha256": digest(text_path),
              "planJsonSha256": digest(json_path),
              "resourceActions": {"add": 5, "change": 0, "destroy": 0},
              "resourceAddresses": sorted(addresses),
              "authentication": "GITHUB_OIDC_WIF_MAIN_ONLY",
              "planArtifactRetention": "EPHEMERAL_JOB_ONLY",
              "containerPublication": "BLOCKED_REPOSITORY_NOT_CREATED",
              "artifactRegistryRepositoryApply": "NOT_EXECUTED",
              "platformApply": "NOT_EXECUTED",
              "artifactUpload": "NOT_EXECUTED",
              "scientificExecution": "NOT_EXECUTED",
              "runtimeAuthority": False,
          }
          rendered = json.dumps(evidence, indent=2, sort_keys=True)
          print("BKL031_AUTHENTICATED_PLAN_EVIDENCE_BEGIN")
          print(rendered)
          print("BKL031_AUTHENTICATED_PLAN_EVIDENCE_END")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## BKL-031 F3-A3 authenticated plan evidence\n\n```json\n" + rendered + "\n```\n",
              encoding="utf-8",
          )
          PY

      - name: Prove no platform state or residual lock was persisted
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage buckets describe "gs://${GCP_STATE_BUCKET}" >/tmp/state-bucket-final.json
          listing="$(gcloud storage ls "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/**" 2>/dev/null || true)"
          if grep -Eq 'default\.(tfstate|tflock)$' <<<"$listing"; then
            printf '%s\n' "$listing" >&2
            echo "Unexpected persistent platform state or lock" >&2
            exit 1
          fi
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"

          apply=NOT_EXECUTED
          imagePush=NOT_EXECUTED
          artifactUpload=NOT_EXECUTED
          scientificExecution=NOT_EXECUTED
          protectedSiteUse=NOT_EXECUTED
          runtimeActivation=NOT_EXECUTED
          EOF
