name: BKL-031 F7 Protected Site One Fresh Forecast Request
on:
  push:
    branches: [feat/bkl-031-f7-fresh-forecast-runtime-boundary]
    paths:
      - governance/forecast-evidence/BKL031-F7-PROTECTED-SITE-PROVIDER-REQUEST-AUTH-001.json
permissions:
  contents: read
concurrency:
  group: bkl-031-f7-protected-site-one-fresh-forecast-request
  cancel-in-progress: false
jobs:
  acquire-once:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify authorization was added in this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          test "$GITHUB_SHA" = "$AFTER"
          git diff --diff-filter=A --name-only "$BEFORE" "$AFTER" | grep -qx 'governance/forecast-evidence/BKL031-F7-PROTECTED-SITE-PROVIDER-REQUEST-AUTH-001.json'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight protected-site privacy, site authority and request plan
        run: node .github/scripts/observation-planner-forecast-f7-protected-site-acquire.mjs --preflight
      - name: Execute exactly one protected-site F7 forecast request
        id: acquire
        run: node .github/scripts/observation-planner-forecast-f7-protected-site-acquire.mjs --execute --confirm=F7_PROTECTED_SITE_ONE_REQUEST --out=work/f7-protected-site-evidence
      - uses: actions/upload-artifact@v4
        if: always() && steps.acquire.outcome != 'skipped'
        with:
          name: bkl-031-f7-protected-site-evidence-${{ github.run_id }}
          path: work/f7-protected-site-evidence
          if-no-files-found: error
          retention-days: 7
