name: BKL-031 F7 F6 Continuity Helper
on:
  push:
    branches: [chore/bkl-031-f7-acceptance-reconciliation]
    paths: ['.github/scripts/repair-bkl031-f6-target-continuity.mjs']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node .github/scripts/repair-bkl031-f6-target-continuity.mjs
      - run: |
          node .github/scripts/generate-roadmap.mjs --write
          node .github/scripts/generate-scientific-platform-status.mjs --write
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/roadmap docs/data/roadmap.json docs/data/scientific-platform-status.json
          git commit -m "fix(bkl-031): retain F6 authorization continuity in F8 target" || exit 0
          git push origin HEAD:chore/bkl-031-f7-acceptance-reconciliation
