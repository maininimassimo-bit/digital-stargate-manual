name: BKL-046 F4 governance

on:
  pull_request:
    paths:
      - '.github/scripts/ai-post-processing-advisory-*.mjs'
      - '.github/scripts/test-ai-post-processing-advisory-*.mjs'
      - '.github/workflows/bkl-046-f4-governance.yml'
      - '.github/workflows/analyze-session-automatic.yml'
      - 'docs/contracts/ai-post-processing-assistant-f4.schema.json'
      - 'docs/architecture/scientific-assets/BKL-046-F4-Session-Provenance-Driven-Read-Only-Consumer.md'
      - '.github/scripts/test-ai-post-processing-assistant-consumer.mjs'
      - 'docs/javascripts/ai-post-processing-assistant-core.mjs'
      - 'docs/javascripts/ai-post-processing-assistant.js'
      - 'docs/styles/ai-post-processing-assistant.css'
      - 'docs/ai-post-processing-assistant/index.md'
      - 'mkdocs.yml'
      - 'docs/architecture/scientific-assets/evidence/BKL-045-F3B-PXP-*.json'
      - 'docs/data/scientific-session-catalog.json'
      - 'docs/data/ai-post-processing-advisory-projection.json'
  push:
    branches: [main]
    paths:
      - '.github/scripts/ai-post-processing-advisory-*.mjs'
      - '.github/scripts/test-ai-post-processing-advisory-*.mjs'
      - '.github/workflows/bkl-046-f4-governance.yml'
      - '.github/workflows/analyze-session-automatic.yml'
      - 'docs/contracts/ai-post-processing-assistant-f4.schema.json'
      - 'docs/architecture/scientific-assets/BKL-046-F4-Session-Provenance-Driven-Read-Only-Consumer.md'
      - '.github/scripts/test-ai-post-processing-assistant-consumer.mjs'
      - 'docs/javascripts/ai-post-processing-assistant-core.mjs'
      - 'docs/javascripts/ai-post-processing-assistant.js'
      - 'docs/styles/ai-post-processing-assistant.css'
      - 'docs/ai-post-processing-assistant/index.md'
      - 'mkdocs.yml'
      - 'docs/architecture/scientific-assets/evidence/BKL-045-F3B-PXP-*.json'
      - 'docs/data/scientific-session-catalog.json'
      - 'docs/data/ai-post-processing-advisory-projection.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkl-046-f4-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f4-contract:
    name: F4 source/projection contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse F4 JSON Schema
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/contracts/ai-post-processing-assistant-f4.schema.json', 'utf8'))"
      - name: Test F4 source discovery and projection mapping
        run: node --test .github/scripts/test-ai-post-processing-advisory-projection.mjs
      - name: Verify persisted F4 projection is current
        run: node .github/scripts/generate-ai-post-processing-advisory-projection.mjs --check
      - name: Verify atomic first and retry workflow integration
        run: node .github/scripts/verify-ai-post-processing-advisory-projection.mjs
      - name: Test F4 portal consumer freshness and accessibility
        run: node --test .github/scripts/test-ai-post-processing-assistant-consumer.mjs
      - name: Regress F2 semantic contract
        run: node --test .github/scripts/test-ai-post-processing-advisory-contract.mjs
      - name: Regress F3 deterministic demonstrator
        run: node --test .github/scripts/test-ai-post-processing-advisory-demonstrator.mjs
