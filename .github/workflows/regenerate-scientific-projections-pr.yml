name: Regenerate Scientific Projections PR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/regenerate-scientific-session-catalog
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate scientific projections
        run: |
          node .github/scripts/generate-scientific-session-catalog.mjs --write
          node .github/scripts/generate-scientific-catalog.mjs --write

      - name: Verify scoped changes
        shell: bash
        run: |
          git status --short
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "No projection drift remains."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              docs/data/scientific-session-catalog.json|docs/data/scientific-observation-index.json) ;;
              *) echo "Unexpected generated change: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit regenerated projections
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/scientific-session-catalog.json docs/data/scientific-observation-index.json
          git commit -m "chore(analytics): refresh governed scientific projections"
          git push origin HEAD:fix/regenerate-scientific-session-catalog
