name: BKL-031 F7 Acceptance Reconciliation Helper

on:
  push:
    branches:
      - chore/bkl-031-f7-acceptance-reconciliation
    paths:
      - '.github/scripts/reconcile-bkl031-f7-acceptance.mjs'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile F7 acceptance
        run: node .github/scripts/reconcile-bkl031-f7-acceptance.mjs
      - name: Regenerate governed projections
        run: |
          node .github/scripts/generate-roadmap.mjs --write
          node .github/scripts/generate-scientific-platform-status.mjs --write
      - name: Commit reconciliation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/roadmap .github/scripts/verify-observation-planner-forecast-f7.mjs mkdocs.yml
          git commit -m "docs(bkl-031): reconcile F7 acceptance and promote F8"
          git push origin HEAD:chore/bkl-031-f7-acceptance-reconciliation
