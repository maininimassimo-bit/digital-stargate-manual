name: BKL-031 F3-A3 Exact Remediated Scientific Execution

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit authorized for one remediated scientific execution
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bkl-031-f3-a3-single-scientific-execution
  cancel-in-progress: false

jobs:
  exact-remediated-execution:
    name: Exact-head single remediated synthetic execution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
      GCP_DATA_BUCKET: ${{ vars.GCP_DATA_BUCKET }}
      GCP_EVIDENCE_BUCKET: ${{ vars.GCP_EVIDENCE_BUCKET }}
      DSG_AUTHORIZED_COMMIT: ${{ inputs.expected_commit }}
      DSG_RUNNER_SOURCE_COMMIT: 5ce8214311757c974134494dcc8f1e232dd4c390
      DSG_RUNNER_IMAGE_REFERENCE: europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike@sha256:f82acf36b79d6f3d8a3ba501b63bdba3ed446e7cf9070f477b01ed5d356ccb52
      DSG_EVIDENCE_PREFIX: bkl-031/f3-a3/scientific-spike/5ce8214311757c974134494dcc8f1e232dd4c390
      DSG_PLATFORM_STATE_SHA256: e527e5f03e0d93a456abc2dc761b19d18479a042ac139960037569c52776f25e
      DSG_KERNEL_URI: gs://digital-stargate-telemetry-183451329061-f3-data/bkl-031/f3-a3/artifacts/spk/de442s/sha256/54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c/de442s.bsp
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require exact authorized main head and identities
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${DSG_AUTHORIZED_COMMIT}"
          grep -Eq '^[0-9a-f]{40}$' <<<"${GITHUB_SHA}"
          test "${GCP_PROJECT_ID}" = "digital-stargate-telemetry"
          test "${GCP_REGION}" = "europe-west8"
          test "${GCP_WIF_PROVIDER}" = "projects/183451329061/locations/global/workloadIdentityPools/dsg-f3-a3-github/providers/github-main"
          test "${GCP_DEPLOY_SERVICE_ACCOUNT}" = "dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com"
          test "${GCP_RUNTIME_SERVICE_ACCOUNT}" = "dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com"
          test "${GCP_STATE_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-state"
          test "${GCP_DATA_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-data"
          test "${GCP_EVIDENCE_BUCKET}" = "digital-stargate-telemetry-183451329061-f3-evidence"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify exact remediated scientific execution policy
        env:
          DSG_METHOD_PROFILE_PATH: infrastructure/bkl-031-f3-a3-gcp/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
          DSG_METHOD_PROFILE_SHA256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
        run: |
          node .github/scripts/verify-bkl-031-f3-a3-method-profile.mjs
          node .github/scripts/verify-bkl-031-f3-a3-scientific-runner-gate.mjs
          node .github/scripts/verify-bkl-031-f3-a3-exact-remediated-scientific-execution.mjs

      - name: Authenticate to Google Cloud through main-only WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "583.0.0"

      - name: Require exact remediated platform, two failed executions and empty evidence prefix
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          gcloud storage cat "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/default.tfstate" >/tmp/platform-state-before.json
          gcloud compute networks subnets describe dsg-f3-a3-private-ew8 --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/subnet-before.json
          gcloud artifacts docker images list "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dsg-f3-a3" --include-tags --format=json >/tmp/images-before.json
          gcloud run jobs describe dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/job-before.json
          gcloud run jobs executions list --job=dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/executions-before.json
          gcloud storage objects describe "$DSG_KERNEL_URI" --format=json >/tmp/kernel-before.json
          gcloud storage cat "$DSG_KERNEL_URI" | sha256sum >/tmp/kernel-before.sha256
          gcloud storage objects list "gs://${GCP_EVIDENCE_BUCKET}/${DSG_EVIDENCE_PREFIX}/**" --format=json >/tmp/evidence-before.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          state_raw = Path('/tmp/platform-state-before.json').read_bytes()
          if hashlib.sha256(state_raw).hexdigest() != 'e527e5f03e0d93a456abc2dc761b19d18479a042ac139960037569c52776f25e':
              raise SystemExit('remediated runner platform state changed')
          state = json.loads(state_raw)
          if state.get('serial') != 6 or state.get('lineage') != '2be9b82b-88d3-888f-4fcd-dded2f74f7f3' or len(state.get('resources', [])) != 4:
              raise SystemExit('remediated runner platform state identity changed')
          subnet = json.loads(Path('/tmp/subnet-before.json').read_text())
          if subnet.get('ipCidrRange') != '10.88.0.0/26' or subnet.get('privateIpGoogleAccess') is not True:
              raise SystemExit('Direct VPC subnet remediation is not present')
          images = json.loads(Path('/tmp/images-before.json').read_text())
          expected_images = {
              'sha256:de3331882e767c3a16fc479224da7c540385a6460e26df1ac73f8305676a0cce': ['candidate-3abc8aa04926'],
              'sha256:69a20a994fde9d5b1533b142760af5796b4ac795a1f00c658373a46d2648d60c': ['runner-9db0267529b6'],
              'sha256:f82acf36b79d6f3d8a3ba501b63bdba3ed446e7cf9070f477b01ed5d356ccb52': ['runner-5ce821431175'],
          }
          if {item.get('version'): item.get('tags', []) for item in images} != expected_images:
              raise SystemExit('registry inventory changed')
          job = json.loads(Path('/tmp/job-before.json').read_text())
          rendered = json.dumps(job, sort_keys=True)
          for required in [
              'europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike@sha256:f82acf36b79d6f3d8a3ba501b63bdba3ed446e7cf9070f477b01ed5d356ccb52',
              'DSG_SOURCE_COMMIT', '5ce8214311757c974134494dcc8f1e232dd4c390',
              'dsg-f3-a3-runtime@digital-stargate-telemetry.iam.gserviceaccount.com',
              'SYNTHETIC_ONLY', 'VALIDATION_SPIKE', 'DENY',
          ]:
              if required not in rendered:
                  raise SystemExit(f'job missing exact reviewed value: {required}')
          if job.get('metadata', {}).get('generation') != 3 or job.get('status', {}).get('executionCount') != 2:
              raise SystemExit('job generation or execution count changed')
          executions = json.loads(Path('/tmp/executions-before.json').read_text())
          expected_names = {'dsg-f3-a3-spike-9drzb', 'dsg-f3-a3-spike-jv646'}
          names = {(item.get('metadata', {}).get('name') or item.get('name', '').rsplit('/', 1)[-1]) for item in executions}
          if names != expected_names:
              raise SystemExit(f'exact failed execution history changed: {names!r}')
          for item in executions:
              completed = [c for c in item.get('status', {}).get('conditions', []) if c.get('type') == 'Completed']
              if item.get('status', {}).get('failedCount') != 1 or len(completed) != 1 or str(completed[0].get('status')).lower() != 'false':
                  raise SystemExit('historical execution is not an exact terminal failure')
          kernel = json.loads(Path('/tmp/kernel-before.json').read_text())
          if str(kernel.get('generation')) != '1789590110146663' or int(kernel.get('size', -1)) != 32701440:
              raise SystemExit('kernel metadata changed')
          if not Path('/tmp/kernel-before.sha256').read_text().startswith('54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c '):
              raise SystemExit('kernel content digest changed')
          if json.loads(Path('/tmp/evidence-before.json').read_text()) != []:
              raise SystemExit('remediated source evidence prefix is not empty')
          PY

      - name: Execute the exact remediated synthetic job once
        shell: bash
        run: |
          set -euo pipefail
          set +e
          gcloud run jobs execute dsg-f3-a3-spike \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --wait \
            --format=json \
            >/tmp/execute-command.json 2>/tmp/execute-command.err
          execute_status=$?
          set -e
          cat /tmp/execute-command.err >&2
          echo "DSG_EXECUTE_STATUS=$execute_status" >>"$GITHUB_ENV"
          gcloud run jobs executions list --job=dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/executions-after.json
          python - <<'PY'
          import json
          from pathlib import Path

          executions = json.loads(Path('/tmp/executions-after.json').read_text())
          if len(executions) != 3:
              raise SystemExit(f'expected two historical failures plus one remediated execution, received {len(executions)}')
          historical = {'dsg-f3-a3-spike-9drzb', 'dsg-f3-a3-spike-jv646'}
          names = {(item.get('metadata', {}).get('name') or item.get('name', '').rsplit('/', 1)[-1]) for item in executions}
          new_names = names - historical
          if len(new_names) != 1:
              raise SystemExit(f'remediated execution identity unavailable: {names!r}')
          Path('/tmp/remediated-execution-name.txt').write_text(next(iter(new_names)), encoding='utf-8')
          PY
          remediated_name="$(cat /tmp/remediated-execution-name.txt)"
          gcloud run jobs executions describe "$remediated_name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/remediated-execution.json

      - name: Retrieve and verify the single private scientific evidence object
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage objects list "gs://${GCP_EVIDENCE_BUCKET}/${DSG_EVIDENCE_PREFIX}/**" --format=json >/tmp/evidence-after.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          execution_name = Path('/tmp/remediated-execution-name.txt').read_text().strip()
          execution = json.loads(Path('/tmp/remediated-execution.json').read_text())
          completed = [c for c in execution.get('status', {}).get('conditions', []) if c.get('type') == 'Completed']
          if os.environ['DSG_EXECUTE_STATUS'] != '0' or len(completed) != 1 or str(completed[0].get('status')).lower() != 'true' or execution.get('status', {}).get('succeededCount') != 1:
              raise SystemExit(f'remediated execution failed: status={os.environ["DSG_EXECUTE_STATUS"]}, conditions={completed!r}')
          objects = json.loads(Path('/tmp/evidence-after.json').read_text())
          if len(objects) != 1:
              raise SystemExit(f'expected one remediated evidence object, received {len(objects)}')
          expected_name = f'bkl-031/f3-a3/scientific-spike/5ce8214311757c974134494dcc8f1e232dd4c390/{execution_name}/evidence.json'
          object_name = objects[0].get('name') or objects[0].get('url') or objects[0].get('storage_url')
          if object_name not in {expected_name, f'gs://digital-stargate-telemetry-183451329061-f3-evidence/{expected_name}'}:
              raise SystemExit(f'unexpected remediated evidence object: {object_name!r}')
          Path('/tmp/evidence-object-name.txt').write_text(expected_name, encoding='utf-8')
          PY
          evidence_uri="gs://${GCP_EVIDENCE_BUCKET}/$(cat /tmp/evidence-object-name.txt)"
          gcloud storage cat "$evidence_uri" >/tmp/scientific-evidence.json
          gcloud storage objects describe "$evidence_uri" --format=json >/tmp/scientific-evidence-metadata.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          path = Path('/tmp/scientific-evidence.json')
          evidence = json.loads(path.read_text())
          execution_name = Path('/tmp/remediated-execution-name.txt').read_text().strip()
          exact = {
              'schemaVersion': '1.0',
              'campaignId': 'BKL-031-F3-A3-SYNTHETIC-CAMPAIGN-001',
              'requestSha256': 'dfac74fd72aa2a835c961cf20c16d88e2ec262cfdca8c45011342436bd05a312',
              'sourceCommit': '5ce8214311757c974134494dcc8f1e232dd4c390',
              'executionHost': 'GOOGLE_CLOUD_RUN_JOB_EUROPE_WEST8',
              'executionId': execution_name,
              'protectedSiteUse': 'NOT_EXECUTED',
              'runtimeActivation': 'NOT_EXECUTED',
          }
          for name, expected in exact.items():
              if evidence.get(name) != expected:
                  raise SystemExit(f'unexpected evidence {name}: {evidence.get(name)!r}')
          if evidence.get('methodProfile') != {'id': 'BKL-031-F3-A3-METHOD-PROFILE-001', 'sha256': 'e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca'}:
              raise SystemExit('method profile identity mismatch')
          if evidence.get('kernel') != {'uri': 'gs://digital-stargate-telemetry-183451329061-f3-data/bkl-031/f3-a3/artifacts/spk/de442s/sha256/54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c/de442s.bsp', 'sha256': '54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c'}:
              raise SystemExit('kernel identity mismatch')
          if evidence.get('networkCalls') != {'privateGoogleApiCallCount': 3, 'destinations': ['metadata.google.internal', 'storage.googleapis.com'], 'externalReferenceCallCount': 0}:
              raise SystemExit('network-call boundary mismatch')
          scientific = evidence.get('scientific', {})
          if len(scientific.get('vectors', [])) != 8 or scientific.get('repeatabilityPass') is not True or scientific.get('allEvaluatedMetricsPass') is not True:
              raise SystemExit('scientific result did not pass exact bounded campaign')
          if scientific.get('metricPassCount') != 17 or scientific.get('metricEvaluationCount') != 17:
              raise SystemExit('scientific metric acceptance count is not 17/17')
          transit = scientific.get('transit', {})
          if transit.get('target') != 'mars' or transit.get('pass') is not True or float(transit.get('errorSeconds', 999)) > 60:
              raise SystemExit('scientific transit acceptance failed')
          normalized = {key: value for key, value in evidence.items() if key not in {'schemaVersion', 'executionHost', 'executionId', 'normalizedResultSha256', 'durationMilliseconds'}}
          canonical = (json.dumps(normalized, sort_keys=True, separators=(',', ':'), ensure_ascii=True) + '\n').encode()
          if hashlib.sha256(canonical).hexdigest() != evidence.get('normalizedResultSha256'):
              raise SystemExit('normalized result digest mismatch')
          metadata = json.loads(Path('/tmp/scientific-evidence-metadata.json').read_text())
          if not str(metadata.get('generation', '')).isdigit() or int(metadata['generation']) <= 0:
              raise SystemExit('evidence object generation is invalid')
          facts = {
              'historicalExecutions': ['dsg-f3-a3-spike-9drzb', 'dsg-f3-a3-spike-jv646'],
              'remediatedExecution': execution_name,
              'objectName': Path('/tmp/evidence-object-name.txt').read_text().strip(),
              'objectGeneration': str(metadata.get('generation')),
              'objectRawSha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'normalizedResultSha256': evidence['normalizedResultSha256'],
              'metricPassCount': 17,
              'metricEvaluationCount': 17,
              'transitErrorSeconds': transit['errorSeconds'],
              'durationMilliseconds': evidence['durationMilliseconds'],
              'externalReferenceCallCount': 0,
              'protectedSiteUse': 'NOT_EXECUTED',
              'runtimeActivation': 'NOT_EXECUTED',
          }
          print('DSG_REMEDIATED_SCIENTIFIC_EVIDENCE_FACTS=' + json.dumps(facts, sort_keys=True, separators=(',', ':')))
          PY

      - name: Verify exact three-execution history and unchanged immutable platform
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/job-final.json
          gcloud run jobs executions list --job=dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/executions-final.json
          gcloud storage cat "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/default.tfstate" >/tmp/platform-state-final.json
          gcloud storage objects describe "$DSG_KERNEL_URI" --format=json >/tmp/kernel-final.json
          gcloud artifacts docker images list "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dsg-f3-a3" --include-tags --format=json >/tmp/images-final.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          executions = json.loads(Path('/tmp/executions-final.json').read_text())
          if len(executions) != 3:
              raise SystemExit('exact three-execution history postcondition failed')
          if hashlib.sha256(Path('/tmp/platform-state-final.json').read_bytes()).hexdigest() != 'e527e5f03e0d93a456abc2dc761b19d18479a042ac139960037569c52776f25e':
              raise SystemExit('remediated runner platform state changed during scientific execution')
          if json.loads(Path('/tmp/kernel-before.json').read_text()) != json.loads(Path('/tmp/kernel-final.json').read_text()):
              raise SystemExit('kernel metadata changed during scientific execution')
          if json.loads(Path('/tmp/images-before.json').read_text()) != json.loads(Path('/tmp/images-final.json').read_text()):
              raise SystemExit('registry inventory changed during scientific execution')
          before_job = json.loads(Path('/tmp/job-before.json').read_text())
          final_job = json.loads(Path('/tmp/job-final.json').read_text())
          if before_job.get('metadata', {}).get('generation') != final_job.get('metadata', {}).get('generation'):
              raise SystemExit('job configuration generation changed during scientific execution')
          rendered = json.dumps(final_job, sort_keys=True)
          for required in ['sha256:f82acf36b79d6f3d8a3ba501b63bdba3ed446e7cf9070f477b01ed5d356ccb52', '5ce8214311757c974134494dcc8f1e232dd4c390']:
              if required not in rendered:
                  raise SystemExit('final job identity changed')
          summary = {
              'executionName': Path('/tmp/remediated-execution-name.txt').read_text().strip(),
              'executionCount': 3,
              'evidenceObject': Path('/tmp/evidence-object-name.txt').read_text().strip(),
              'platformStateRawSha256': 'e527e5f03e0d93a456abc2dc761b19d18479a042ac139960037569c52776f25e',
              'jobConfigurationGeneration': final_job.get('metadata', {}).get('generation'),
              'cloudMutation': 'ONE_JOB_EXECUTION_AND_ONE_CREATE_ONLY_EVIDENCE_OBJECT',
              'externalReferenceCallCount': 0,
              'protectedSiteUse': 'NOT_EXECUTED',
              'runtimeActivation': 'NOT_EXECUTED',
          }
          print('DSG_REMEDIATED_EXECUTION_POSTCONDITION=' + json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY
