name: Promote session package to main

on:
  push:
    branches:
      - 'session/**'
    paths:
      - 'data/sessions/**'
      - 'docs/session-reports/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: session-package-promotion-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout session branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate session identity
        id: session
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          [[ "$branch" =~ ^session/([0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{4}-[0-9]{2}-[0-9]{2})$ ]] || {
            echo "Invalid session branch: $branch"
            exit 1
          }
          id="${BASH_REMATCH[1]}"
          year="${id:0:4}"
          month="${id:5:2}"
          root="data/sessions/$year/$month/$id"
          test -f "$root/manifest.json" || { echo "Manifest missing: $root/manifest.json"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Fetch current main
        shell: bash
        run: git fetch origin main

      - name: Validate promotion contract
        shell: pwsh
        run: |
          ./.github/scripts/validate-session-promotion.ps1 `
            -SessionId '${{ steps.session.outputs.id }}' `
            -Root '${{ steps.session.outputs.root }}' `
            -BaseRef 'origin/main'

      - name: Promote package by fast-forwarding main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Dispatch downstream analytics and catalog pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run analyze-session-automatic.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f session_id='${{ steps.session.outputs.id }}'
