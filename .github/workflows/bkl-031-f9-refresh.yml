name: BKL-031 F9 MeteoHub Refresh
on:
  schedule:
    # 09:30 UTC (11:30 Europe/Rome during CEST) for the validation run; 17:15 UTC (19:15 Europe/Rome during CEST) unchanged.
    - cron: '30 9 * * *'
    - cron: '15 17 * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ALLOW_ONE_TEST_ACQUISITION to authorize one manual F9 acquisition'
        required: true
        type: string
      purpose:
        description: 'Short reason for the governed test'
        required: true
        type: string
concurrency:
  group: bkl-031-f9-meteohub-refresh
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  refresh:
    # Keep activation explicit even though this public repository uses the
    # no-fee standard-runner boundary.
    if: github.ref == 'refs/heads/main' && vars.F9_ZERO_EUR_GUARD == 'CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Enforce schedule-only first-attempt acquisition
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "${{ inputs.confirmation }}" = "ALLOW_ONE_TEST_ACQUISITION"
            test -n "${{ inputs.purpose }}"
          else
            exit 1
          fi
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Enforce two-acquisition daily budget
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          count=0
          for run in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/bkl-031-f9-refresh.yml/runs?per_page=100" --jq '.workflow_runs[] | select(.created_at >= "'"$today"'T00:00:00Z" and (.id|tostring) != "'"$GITHUB_RUN_ID"'") | .id'); do
            started=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" --jq '[.jobs[].steps[]? | select(.name == "Acquire, reduce and discard GRIB inputs" and (.conclusion == "success" or .conclusion == "failure"))] | length')
            count=$((count + started))
          done
          test "$count" -lt 2
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -r .github/scripts/requirements-observation-planner-f9.txt
      - name: Acquire, reduce and discard GRIB inputs
        run: python .github/scripts/observation_planner_f9.py
      - name: Verify sanitised projection
        run: python .github/scripts/observation_planner_f9.py --validate docs/data/observation-planner-f9-current-night.json
      - name: Commit only the sanitised projection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/observation-planner-f9-current-night.json
          git diff --cached --quiet && exit 0
          git commit -m "data(observation-planner): refresh governed current-night forecast"
          git push origin HEAD:main
