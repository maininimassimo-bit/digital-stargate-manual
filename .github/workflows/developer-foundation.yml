      - { name: Test BKL-036 F2 fail-closed rules, run: node --test .github/scripts/test-bkl-036-f2-evidence-envelope.mjs }
      - { name: Generate BKL-036 F3 archived evidence score, run: node .github/scripts/generate-bkl-036-f3-health-score.mjs --check }
      - { name: Verify BKL-036 F3 archived evidence score, run: node .github/scripts/verify-bkl-036-f3-health-score.mjs }
      - { name: Test BKL-036 F3 fail-closed rules, run: node --test .github/scripts/test-bkl-036-f3-health-score.mjs }
      - { name: Verify BKL-036 F4 archived telemetry, run: node .github/scripts/verify-bkl-036-f4-archived-telemetry.mjs }
      - { name: Test BKL-036 F4 acquisition and archival boundaries, run: node --test .github/scripts/test-bkl-036-f4-archived-telemetry.mjs }
      - { name: Verify BKL-036 F5 live health score envelope, run: node .github/scripts/verify-bkl-036-f5-live-health-score.mjs }
      - { name: Verify BKL-036 F5 EAGLE Health policy, run: node .github/scripts/verify-bkl-036-f5-eagle-health-policy.mjs }
      - { name: Test BKL-038 F3 deterministic identity, run: node --test .github/scripts/test-anomaly-trend-f3-id.mjs }
      - { name: Test BKL-038 F3-B deterministic read-only engine, run: node --test .github/scripts/test-anomaly-trend-f3b-engine.mjs }
      - { name: Verify BKL-039 F2 bounded registry fixture, run: node .github/scripts/verify-equipment-performance-registry-f2.mjs }
      - { name: Test BKL-039 F2 fail-closed rules, run: node --test .github/scripts/test-equipment-performance-registry-f2.mjs }
      - { name: Verify BKL-039 F3 generated descriptive projection, run: node .github/scripts/generate-equipment-performance-registry-f3.mjs --check }
      - { name: Verify BKL-039 F3 descriptive performance projection, run: node .github/scripts/verify-equipment-performance-registry-f3.mjs }
      - { name: Test BKL-039 F3 fail-closed rules, run: node --test .github/scripts/test-equipment-performance-registry-f3.mjs }
      - { name: Verify BKL-039 F4 generated read model, run: node .github/scripts/generate-equipment-performance-registry-f4-read-model.mjs }
      - { name: Verify BKL-039 F4 read-only consumer, run: node .github/scripts/verify-equipment-performance-registry-f4-read-model.mjs }
      - { name: Test BKL-039 F4 fail-closed rules, run: node .github/scripts/test-equipment-performance-registry-f4-read-model.mjs }
      - name: Verify generated roadmap
        run: node .github/scripts/generate-roadmap.mjs --check
      - { name: Verify closure / roadmap / backlog consistency, run: node .github/scripts/verify-roadmap-consistency.mjs }
      - { name: Verify AP-015 CAP-40 semantic contract, run: node .github/scripts/verify-ap015-semantic-contract.mjs }
      - { name: Verify BKL-033 Digital Twin contract, run: node .github/scripts/verify-bkl033-digital-twin.mjs }
