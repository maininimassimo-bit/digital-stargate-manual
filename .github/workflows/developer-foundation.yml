",".github/workflows/developer-foundation.yml"]
  pull_request:
    paths: ["src/**","tests/**","dsg-analytics/**","data/analytics/**","data/sessions/**/normalized/session-metrics.json","*.sln","*.props","global.json",".editorconfig","scripts/telemetry/**","requirements.txt","schemas/**","infrastructure/bkl042-ai-relay/**",".github/scripts/**","contracts/telemetry/**","docs/data/bkl-036-f2-descriptive-health-fixture.json", "docs/data/bkl-036-f4-telemetry-ingest-fixture.json", "docs/data/bkl-036-f4-telemetry-archive.json",".github/roadmap/**",".github/workflows/deploy-pages.yml","docs/data/roadmap.json","docs/data/observation-planner-context-f2-fixture.json","docs/data/observation-planner-ephemeris-lunar-f3c-projection.json","docs/data/observation-planner-forecast-f4d-projection.json","docs/data/observation-planner-ranking-f5-fixture.json","docs/data/observation-planner-ranking-f5-projection.json","docs/data/observation-planner-e2e-f6-projection.json","docs/data/knowledge-graph.json","docs/data/knowledge-ai-evidence-contract.json","docs/data/knowledge-ai-seed-reconciliation.json","docs/data/knowledge-ai-read-model.json","docs/data/target-knowledge-base.json","docs/data/target-identity-reconciliation.json","docs/data/target-knowledge-read-model.json","docs/data/night-timeline-replay.json","docs/data/night-timeline-replay-f3.json","docs/data/night-timeline-read-model.json","docs/data/anomaly-trend-f2-fixture.json","docs/data/equipment-performance-registry-f2-fixture.json","docs/data/equipment-performance-registry-f3.json","docs/data/equipment-performance-registry-f4-read-model.json","docs/data/scientific-session-catalog.json","docs/data/scientific-observation-index.json","docs/project/BACKLOG.md","docs/project/BKL-*CLOSURE*.md","docs/project/CURRENT_TECHNICAL_BASELINE*.md","docs/architecture/knowledge/**","docs/architecture/telemetry/**","docs/architecture/traceability-register.md","docs/architecture/ADR-*.md","docs/architecture/assessments/ADR-*.md","docs/architecture/assessments/AMP-002-Architecture-Program-Roadmap-Realignment.md",".github/workflows/developer-foundation.yml"]
permissions: { contents: read }
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - { name: Checkout, uses: actions/checkout@v5 }
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json, cache: true, cache-dependency-path: Directory.Packages.props }
      - { name: Restore, run: dotnet restore DigitalStarGate.sln }
      - { name: Build, run: dotnet build DigitalStarGate.sln --configuration Release --no-restore }
      - { name: Test, run: dotnet test DigitalStarGate.sln --configuration Release --no-build }
      - { name: Verify formatting, run: dotnet format DigitalStarGate.sln --verify-no-changes --no-restore }
      - { name: Test CloudWatcher telemetry adapter, shell: pwsh, run: ./.github/scripts/test-cloudwatcher-telemetry-adapter.ps1 }
      - { name: Test EAGLE host health collector contract, shell: pwsh, run: ./.github/scripts/test-eagle-host-health-collector.ps1 }
      - { name: Test EAGLE health history serializer, shell: pwsh, run: ./.github/scripts/test-eagle-health-history-serializer.ps1 }
      - { name: Test EAGLE health history writer, shell: pwsh, run: ./.github/scripts/test-eagle-health-history-writer.ps1 }
      - { name: Test EAGLE health history failure injection, shell: pwsh, run: ./.github/scripts/test-eagle-health-history-failure-injection.ps1 }
      - { name: Test EAGLE health portal projection, shell: pwsh, run: ./.github/scripts/test-eagle-health-portal-projection.ps1 }
      - { name: Test EAGLE health portal bounded history, shell: pwsh, run: ./.github/scripts/test-eagle-health-portal-history.ps1 }
      - { name: Test session promotion fail-safe contract, shell: pwsh, run: ./.github/scripts/test-session-promotion.ps1 }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - { name: Test EAGLE health portal browser failure injection, run: node --test .github/scripts/test-eagle-health-portal-failure-injection.mjs }
      - { name: Test SessionCompleted shadow event fail-closed rules, run: node .github/scripts/test-session-completed-shadow-event.mjs }
      - { name: Test SessionCompleted shadow contract compatibility, run: node .github/scripts/test-session-completed-shadow-contract-compatibility.mjs }
      - { name: Test SessionCompleted live shadow transport boundaries, run: node .github/scripts/test-session-completed-live-shadow-transport.mjs }
      - { name: Verify repository knowledge graph, run: node .github/scripts/verify-knowledge-graph.mjs }
      - { name: Verify repository knowledge graph coverage, run: node .github/scripts/verify-knowledge-graph-coverage.mjs }
      - { name: Verify knowledge graph material relations, run: node .github/scripts/verify-knowledge-graph-material-relations.mjs }
      - { name: Verify Knowledge / AI evidence contract, run: node .github/scripts/verify-knowledge-ai-evidence-contract.mjs }
      - { name: Test Knowledge / AI evidence fail-closed rules, run: node --test .github/scripts/test-knowledge-ai-evidence-contract.mjs }
      - { name: Verify Knowledge / AI governed seed reconciliation, run: node .github/scripts/verify-knowledge-ai-seed-reconciliation.mjs }
      - { name: Test Knowledge / AI seed reconciliation fail-closed rules, run: node --test .github/scripts/test-knowledge-ai-seed-reconciliation.mjs }
      - { name: Verify Knowledge / AI consumer read model, run: node .github/scripts/verify-knowledge-ai-read-model.mjs }
      - { name: Test Knowledge / AI consumer fail-closed rules, run: node --test .github/scripts/test-knowledge-ai-read-model.mjs }
      - { name: Verify Target Knowledge Base F2 fixture, run: node .github/scripts/verify-target-knowledge-base.mjs }
      - { name: Test Target Knowledge Base F2 fail-closed rules, run: node --test .github/scripts/test-target-knowledge-base.mjs }
      - { name: Verify Observation Planner F2 context contract, run: node .github/scripts/verify-observation-planner-context-f2.mjs }
      - { name: Test Observation Planner F2 fail-closed rules, run: node --test .github/scripts/test-observation-planner-context-f2.mjs }
      - { name: Verify Observation Planner F3-B ephemeris lunar contracts, run: node .github/scripts/verify-observation-planner-ephemeris-lunar-f3b.mjs }
      - { name: Test Observation Planner F3-B fail-closed and privacy rules, run: node --test .github/scripts/test-observation-planner-ephemeris-lunar-f3b.mjs }
      - { name: Verify Observation Planner F3-C bounded integration, run: node .github/scripts/verify-observation-planner-ephemeris-lunar-f3c.mjs }
      - { name: Test Observation Planner F3-C adapter and portal boundaries, run: node --test .github/scripts/test-observation-planner-ephemeris-lunar-f3c.mjs }
      - { name: Verify Observation Planner F4-A forecast source contract, run: node .github/scripts/verify-observation-planner-forecast-f4a.mjs }
      - { name: Verify Observation Planner F4-B forecast contracts, run: node .github/scripts/verify-observation-planner-forecast-f4b.mjs }
