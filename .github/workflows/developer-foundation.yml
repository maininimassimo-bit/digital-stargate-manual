      - { name: Verify BKL-034-F2 image archive contract, run: node .github/scripts/verify-bkl034-f2-image-archive.mjs }
      - { name: Verify BKL-034-F2 ingestion preflight, run: node .github/scripts/verify-bkl034-f2-ingestion-preflight.mjs }
      - { name: Test BKL-043-F3 offline reliability envelope, run: node --test .github/scripts/test-bkl043-f3-offline-contract.mjs }
      - { name: Verify BKL-042-F2 advisory response contract, run: node .github/scripts/verify-bkl042-f2-advisory-response.mjs }
      - { name: Generate BKL-042-F3 deterministic advisory, run: node .github/scripts/generate-bkl042-f3-advisory.mjs }
      - { name: Verify BKL-042-F3 deterministic advisory, run: node .github/scripts/verify-bkl042-f3-advisory.mjs }
      - { name: Test BKL-042-F3 deterministic advisory, run: node .github/scripts/test-bkl042-f3-advisory.mjs }
      - { name: Test BKL-042-F4 read-only consumer, run: node .github/scripts/test-bkl042-f4-consumer.mjs }
      - { name: Generate BKL-042-F5 real-evidence evaluation, run: node .github/scripts/generate-bkl042-f5-evaluation.mjs }
      - { name: Verify BKL-042-F5 real-evidence evaluation, run: node .github/scripts/verify-bkl042-f5-evaluation.mjs }
      - { name: Verify BKL-042-F6 read-only chat contract, run: node .github/scripts/verify-bkl042-f6-chat.mjs }
      - { name: Verify BKL-042-F6 runtime adapter dry-run, run: node .github/scripts/verify-bkl042-f6-runtime-dry-run.mjs }
      - { name: Verify knowledge graph projection, run: node .github/scripts/verify-knowledge-graph.mjs }
      - { name: Verify knowledge graph coverage, run: node .github/scripts/verify-knowledge-graph-coverage.mjs }
      - { name: Verify knowledge graph material relations, run: node .github/scripts/verify-knowledge-graph-material-relations.mjs }
      - { name: Verify scientific observation index, run: node .github/scripts/generate-scientific-catalog.mjs --check }
      - { name: Test scientific PHD2 guiding parser, run: node --test .github/scripts/test-phd2-guiding.mjs }
      - { name: Verify scientific session catalog, run: node .github/scripts/generate-scientific-session-catalog.mjs --check }
      - { name: Test Enterprise Plugin SDK, run: node --test .github/scripts/test-plugin-sdk.mjs }
      - { name: Test Enterprise Search Center, run: node --test .github/scripts/test-search-center.mjs }
      - { name: Test PixInsight Manifest Contract, run: node --test .github/scripts/test-pixinsight-manifest.mjs }
      - { name: Test PixInsight Synchronization Ledger, run: node --test .github/scripts/test-pixinsight-ledger.mjs }
      - { name: Test PixInsight Read-Only Reconciliation, run: node --test .github/scripts/test-pixinsight-reconciliation.mjs }
      - { name: Test PixInsight Processing Projection, run: node --test .github/scripts/test-pixinsight-processing-projection.mjs }
      - { name: Test PixInsight Provenance Sidecar Adapter, run: node --test .github/scripts/test-pixinsight-provenance-to-manifest.mjs }
      - name: Setup Python
        uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Test BKL-042 server-side retrieval minimization
        run: python -m unittest
        working-directory: infrastructure/bkl042-ai-relay
      - name: Install documentation and report dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --disable-pip-version-check reportlab
      - { name: Test canonical scientific session evidence, run: python dsg-analytics/tests/test_scientific_session_evidence.py }
      - { name: Test homepage datetime normalization, run: python dsg-analytics/tests/test_homepage_datetime_normalization.py }
      - { name: Test real-session scientific E2E projections, shell: bash, run: bash ./.github/scripts/test-scientific-session-e2e.sh }
      - { name: Test real-session downstream idempotency, shell: bash, run: bash ./.github/scripts/test-real-session-idempotency.sh 2026-08-15_2026-08-16 }
      - { name: Verify MkDocs, run: mkdocs build --strict }
