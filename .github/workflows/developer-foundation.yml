name: Developer Foundation

on:
  push:
    branches: [main, release/1.5-developer-foundation]
    paths: ["src/**","tests/**","dsg-analytics/**","data/analytics/**","data/sessions/**/normalized/session-metrics.json","*.sln","*.props","global.json",".editorconfig","scripts/telemetry/**","requirements.txt","schemas/**",".github/scripts/**",".github/roadmap/**",".github/workflows/deploy-pages.yml","docs/data/roadmap.json","docs/data/knowledge-graph.json","docs/data/knowledge-ai-evidence-contract.json","docs/data/knowledge-ai-seed-reconciliation.json","docs/data/knowledge-ai-read-model.json","docs/data/target-knowledge-base.json","docs/data/target-identity-reconciliation.json","docs/data/target-knowledge-read-model.json","docs/data/night-timeline-replay.json","docs/data/night-timeline-replay-f3.json","docs/data/night-timeline-read-model.json","docs/data/anomaly-trend-f2-fixture.json","docs/data/equipment-performance-registry-f2-fixture.json","docs/data/scientific-session-catalog.json","docs/data/scientific-observation-index.json","docs/project/BACKLOG.md","docs/project/BKL-*CLOSURE*.md","docs/project/CURRENT_TECHNICAL_BASELINE*.md","docs/architecture/knowledge/**","docs/architecture/telemetry/**","docs/architecture/traceability-register.md","docs/architecture/ADR-*.md","docs/architecture/assessments/ADR-*.md","docs/architecture/assessments/AMP-002-Architecture-Program-Roadmap-Realignment.md",".github/workflows/developer-foundation.yml"]
  pull_request:
    paths: ["src/**","tests/**","dsg-analytics/**","data/analytics/**","data/sessions/**/normalized/session-metrics.json","*.sln","*.props","global.json",".editorconfig","scripts/telemetry/**","requirements.txt","schemas/**",".github/scripts/**",".github/roadmap/**",".github/workflows/deploy-pages.yml","docs/data/roadmap.json","docs/data/knowledge-graph.json","docs/data/knowledge-ai-evidence-contract.json","docs/data/knowledge-ai-seed-reconciliation.json","docs/data/knowledge-ai-read-model.json","docs/data/target-knowledge-base.json","docs/data/target-identity-reconciliation.json","docs/data/target-knowledge-read-model.json","docs/data/night-timeline-replay.json","docs/data/night-timeline-replay-f3.json","docs/data/night-timeline-read-model.json","docs/data/anomaly-trend-f2-fixture.json","docs/data/equipment-performance-registry-f2-fixture.json","docs/data/scientific-session-catalog.json","docs/data/scientific-observation-index.json","docs/project/BACKLOG.md","docs/project/BKL-*CLOSURE*.md","docs/project/CURRENT_TECHNICAL_BASELINE*.md","docs/architecture/knowledge/**","docs/architecture/telemetry/**","docs/architecture/traceability-register.md","docs/architecture/ADR-*.md","docs/architecture/assessments/ADR-*.md","docs/architecture/assessments/AMP-002-Architecture-Program-Roadmap-Realignment.md",".github/workflows/developer-foundation.yml"]
permissions: { contents: read }
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - { name: Checkout, uses: actions/checkout@v5 }
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with: { global-json-file: global.json, cache: true, cache-dependency-path: Directory.Packages.props }
      - { name: Restore, run: dotnet restore DigitalStarGate.sln }
      - { name: Build, run: dotnet build DigitalStarGate.sln --configuration Release --no-restore }
      - { name: Test, run: dotnet test DigitalStarGate.sln --configuration Release --no-build }
      - { name: Verify formatting, run: dotnet format DigitalStarGate.sln --verify-no-changes --no-restore }
      - { name: Test CloudWatcher telemetry adapter, shell: pwsh, run: ./.github/scripts/test-cloudwatcher-telemetry-adapter.ps1 }
      - { name: Test EAGLE host health collector contract, shell: pwsh, run: ./.github/scripts/test-eagle-host-health-collector.ps1 }
      - { name: Test EAGLE health history serializer, shell: pwsh, run: ./.github/scripts/test-eagle-health-history-serializer.ps1 }
      - { name: Test EAGLE health history writer, shell: pwsh, run: ./.github/scripts/test-eagle-health-history-writer.ps1 }
      - { name: Test EAGLE health history failure injection, shell: pwsh, run: ./.github/scripts/test-eagle-health-history-failure-injection.ps1 }
      - { name: Test EAGLE health portal projection, shell: pwsh, run: ./.github/scripts/test-eagle-health-portal-projection.ps1 }
      - { name: Test EAGLE health portal bounded history, shell: pwsh, run: ./.github/scripts/test-eagle-health-portal-history.ps1 }
      - { name: Test session promotion fail-safe contract, shell: pwsh, run: ./.github/scripts/test-session-promotion.ps1 }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - { name: Test EAGLE health portal browser failure injection, run: node --test .github/scripts/test-eagle-health-portal-failure-injection.mjs }
      - { name: Verify repository knowledge graph, run: node .github/scripts/verify-knowledge-graph.mjs }
      - { name: Verify repository knowledge graph coverage, run: node .github/scripts/verify-knowledge-graph-coverage.mjs }
      - { name: Verify knowledge graph material relations, run: node .github/scripts/verify-knowledge-graph-material-relations.mjs }
      - { name: Verify Knowledge / AI evidence contract, run: node .github/scripts/verify-knowledge-ai-evidence-contract.mjs }
      - { name: Test Knowledge / AI evidence fail-closed rules, run: node --test .github/scripts/test-knowledge-ai-evidence-contract.mjs }
      - { name: Verify Knowledge / AI governed seed reconciliation, run: node .github/scripts/verify-knowledge-ai-seed-reconciliation.mjs }
      - { name: Test Knowledge / AI seed reconciliation fail-closed rules, run: node --test .github/scripts/test-knowledge-ai-seed-reconciliation.mjs }
      - { name: Verify Knowledge / AI consumer read model, run: node .github/scripts/verify-knowledge-ai-read-model.mjs }
      - { name: Test Knowledge / AI consumer fail-closed rules, run: node --test .github/scripts/test-knowledge-ai-read-model.mjs }
      - { name: Verify Target Knowledge Base F2 fixture, run: node .github/scripts/verify-target-knowledge-base.mjs }
      - { name: Test Target Knowledge Base F2 fail-closed rules, run: node --test .github/scripts/test-target-knowledge-base.mjs }
      - { name: Verify Target Identity Reconciliation F3, run: node .github/scripts/verify-target-identity-reconciliation.mjs }
      - { name: Test Target Identity Reconciliation F3 fail-closed rules, run: node --test .github/scripts/test-target-identity-reconciliation.mjs }
      - { name: Verify Target Knowledge F4 consumer read model, run: node .github/scripts/verify-target-knowledge-read-model.mjs }
      - { name: Test Target Knowledge F4 consumer fail-closed rules, run: node --test .github/scripts/test-target-knowledge-read-model.mjs }
      - { name: Verify Night Timeline Replay F2 fixture, run: node .github/scripts/verify-night-timeline-replay.mjs }
      - { name: Test Night Timeline Replay F2 fail-closed rules, run: node --test .github/scripts/test-night-timeline-replay.mjs }
      - { name: Verify Night Timeline Replay F3 synchronization, run: node .github/scripts/verify-night-timeline-f3.mjs }
      - { name: Test Night Timeline Replay F3 fail-closed rules, run: node --test .github/scripts/test-night-timeline-f3.mjs }
      - { name: Verify Night Timeline F4 consumer read model, run: node .github/scripts/verify-night-timeline-read-model.mjs }
      - { name: Test Night Timeline F4 consumer fail-closed rules, run: node --test .github/scripts/test-night-timeline-read-model.mjs }
      - { name: Verify BKL-038 F2 analytical fixture, run: node .github/scripts/verify-anomaly-trend-f2.mjs }
      - { name: Test BKL-038 F2 fail-closed rules, run: node --test .github/scripts/test-anomaly-trend-f2.mjs }
      - { name: Test BKL-038 F3 deterministic identity, run: node --test .github/scripts/test-anomaly-trend-f3-id.mjs }
      - { name: Test BKL-038 F3-B deterministic read-only engine, run: node --test .github/scripts/test-anomaly-trend-f3b-engine.mjs }
      - { name: Verify BKL-039 F2 bounded registry fixture, run: node .github/scripts/verify-equipment-performance-registry-f2.mjs }
      - { name: Test BKL-039 F2 fail-closed rules, run: node --test .github/scripts/test-equipment-performance-registry-f2.mjs }
      - name: Verify generated roadmap
        run: node .github/scripts/generate-roadmap.mjs --check
      - { name: Verify closure / roadmap / backlog consistency, run: node .github/scripts/verify-roadmap-consistency.mjs }
      - { name: Verify scientific observation index, run: node .github/scripts/generate-scientific-catalog.mjs --check }
      - { name: Test scientific PHD2 guiding parser, run: node --test .github/scripts/test-phd2-guiding.mjs }
      - { name: Verify scientific session catalog, run: node .github/scripts/generate-scientific-session-catalog.mjs --check }
      - { name: Test Enterprise Plugin SDK, run: node --test .github/scripts/test-plugin-sdk.mjs }
      - { name: Test Enterprise Search Center, run: node --test .github/scripts/test-search-center.mjs }
      - { name: Test PixInsight Manifest Contract, run: node --test .github/scripts/test-pixinsight-manifest.mjs }
      - { name: Test PixInsight Synchronization Ledger, run: node --test .github/scripts/test-pixinsight-ledger.mjs }
      - { name: Test PixInsight Read-Only Reconciliation, run: node --test .github/scripts/test-pixinsight-reconciliation.mjs }
      - { name: Test PixInsight Processing Projection, run: node --test .github/scripts/test-pixinsight-processing-projection.mjs }
      - name: Setup Python
        uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install documentation and report dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --disable-pip-version-check reportlab
      - { name: Test canonical scientific session evidence, run: python dsg-analytics/tests/test_scientific_session_evidence.py }
      - { name: Test homepage datetime normalization, run: python dsg-analytics/tests/test_homepage_datetime_normalization.py }
      - { name: Test real-session scientific E2E projections, shell: bash, run: bash ./.github/scripts/test-scientific-session-e2e.sh }
      - { name: Test real-session downstream idempotency, shell: bash, run: bash ./.github/scripts/test-real-session-idempotency.sh 2026-08-15_2026-08-16 }
      - { name: Verify MkDocs, run: mkdocs build --strict }
