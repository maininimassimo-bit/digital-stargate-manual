name: BKL-041 F5 Governance

on:
  pull_request:
    paths:
      - '.github/scripts/*scientific-data-quality*f5*'
      - '.github/scripts/scientific-data-quality-real-evidence-validation.mjs'
      - '.github/workflows/analyze-session-automatic.yml'
      - '.github/workflows/bkl-041-f5-governance.yml'
      - 'docs/contracts/scientific-data-quality-f5-validation.schema.json'
      - 'docs/data/scientific-data-quality-f5-validation.json'
      - 'docs/javascripts/scientific-data-quality*'
      - 'docs/styles/scientific-data-quality.css'
      - 'docs/architecture/scientific-assets/BKL-041-F5-*.md'
      - 'docs/project/BKL-041-CLOSURE-*.md'
  push:
    branches: [main]
    paths:
      - '.github/scripts/*scientific-data-quality*f5*'
      - '.github/scripts/scientific-data-quality-real-evidence-validation.mjs'
      - '.github/workflows/analyze-session-automatic.yml'
      - '.github/workflows/bkl-041-f5-governance.yml'
      - 'docs/contracts/scientific-data-quality-f5-validation.schema.json'
      - 'docs/data/scientific-data-quality-f5-validation.json'
      - 'docs/javascripts/scientific-data-quality*'
      - 'docs/styles/scientific-data-quality.css'
      - 'docs/architecture/scientific-assets/BKL-041-F5-*.md'
      - 'docs/project/BKL-041-CLOSURE-*.md'

permissions: { contents: read }

jobs:
  real-evidence-and-closure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Verify F5 persisted evidence and automatic refresh
        run: node .github/scripts/verify-scientific-data-quality-f5-validation.mjs
      - name: Verify F5 generator idempotency
        run: node .github/scripts/generate-scientific-data-quality-f5-validation.mjs --check
      - name: Test F5 real-evidence and browser contract
        run: node --test .github/scripts/test-scientific-data-quality-f5-validation.mjs
      - name: Test F4 and F3 regressions
        run: node --test .github/scripts/test-scientific-data-quality-projection.mjs .github/scripts/test-scientific-data-quality-consumer.mjs .github/scripts/test-scientific-data-quality-scoring.mjs
      - name: Check browser modules
        run: node --check docs/javascripts/scientific-data-quality-core.mjs && node --check docs/javascripts/scientific-data-quality.js
