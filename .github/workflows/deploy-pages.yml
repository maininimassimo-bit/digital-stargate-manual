name: Deploy MkDocs artifact to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Authoritative GitHub Pages owner for this repository.
# Other documentation workflows may validate/build artifacts but must not deploy.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-artifact-main
  cancel-in-progress: true

jobs:
  build:
    name: Build authoritative Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify no inline portal JavaScript
        run: node .github/scripts/verify-no-inline-portal-js.mjs

      - name: Verify committed roadmap projection
        run: node .github/scripts/generate-roadmap.mjs --check

      - name: Verify roadmap governance consistency
        run: node .github/scripts/verify-roadmap-consistency.mjs

      - name: Generate governed roadmap
        run: node .github/scripts/generate-roadmap.mjs --write

      - name: Generate scientific observation index
        run: node .github/scripts/generate-scientific-catalog.mjs --write

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Refresh governed latest observation
        run: python dsg-analytics/reporter/refresh_latest_observation.py --repo-root .

      - name: Refresh governed homepage projections
        run: python dsg-analytics/homepage/refresh_homepage.py --repo-root .

      - name: Install documentation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-docs.txt ]; then
            python -m pip install -r requirements-docs.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install mkdocs-material
          fi

      - name: Build documentation
        run: mkdocs build --strict --config-file mkdocs.pages.yml

      - name: Verify published-site integrity
        run: python .github/scripts/verify-published-site.py --site site --base-path /digital-stargate-manual/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy authoritative GitHub Pages artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
