name: Validate documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.pages.yml"
      - "requirements*.txt"
      - ".github/scripts/verify-published-site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Installa dipendenze
        run: |
          if [ -f requirements-docs.txt ]; then
            pip install -r requirements-docs.txt
          else
            pip install -r requirements.txt
          fi

      - name: Verifica documentazione
        run: mkdocs build --strict --config-file mkdocs.pages.yml

      - name: Verifica integrità artifact
        run: python .github/scripts/verify-published-site.py --site site --base-path /digital-stargate-manual/
