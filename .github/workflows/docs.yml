name: Validate documentation (no deploy)

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.pages.yml"
      - "requirements*.txt"
      - ".github/scripts/verify-published-site.py"
      - ".github/scripts/verify-no-inline-portal-js.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs.pages.yml"
      - "requirements*.txt"
      - ".github/scripts/verify-published-site.py"
      - ".github/scripts/verify-no-inline-portal-js.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Validation-only workflow. It intentionally has no Pages write permission and
# must never publish. GitHub Pages deployment ownership belongs exclusively to
# .github/workflows/deploy-pages.yml.
permissions:
  contents: read

jobs:
  validate:
    name: Validate MkDocs artifact
    runs-on: ubuntu-latest

    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verifica assenza JavaScript inline nel portale
        run: node .github/scripts/verify-no-inline-portal-js.mjs

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Installa dipendenze
        run: |
          if [ -f requirements-docs.txt ]; then
            pip install -r requirements-docs.txt
          else
            pip install -r requirements.txt
          fi

      - name: Verifica documentazione
        run: mkdocs build --strict --config-file mkdocs.pages.yml

      - name: Verifica integrita artifact
        run: python .github/scripts/verify-published-site.py --site site --base-path /digital-stargate-manual/
