name: Pubblica documentazione

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recupera repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Verifica documentazione
        run: mkdocs build --strict --config-file mkdocs.pages.yml

      - name: Verifica integrità artifact
        run: python .github/scripts/verify-published-site.py --site site --base-path /digital-stargate-manual/

      - name: Pubblica su GitHub Pages
        run: mkdocs gh-deploy --force --config-file mkdocs.pages.yml
