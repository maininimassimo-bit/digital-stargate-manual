name: BKL-031 F7 Candidate Reconciliation
on:
  push:
    branches: [feat/bkl-031-f7-fresh-forecast-runtime-boundary]
    paths:
      - .github/scripts/reconcile-observation-planner-f7-candidate.mjs
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node .github/scripts/reconcile-observation-planner-f7-candidate.mjs
      - name: Commit candidate governance reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/developer-foundation.yml docs/project/DECISION_LOG.md docs/project/index.md mkdocs.yml
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
          else
            git commit -m "chore(observation-planner): reconcile F7 candidate governance"
            git push origin HEAD:feat/bkl-031-f7-fresh-forecast-runtime-boundary
          fi
