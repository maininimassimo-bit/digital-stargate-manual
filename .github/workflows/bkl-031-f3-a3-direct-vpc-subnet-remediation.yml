name: BKL-031 F3-A3 Exact Direct VPC Subnet Remediation

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact main commit authorized for the one-update subnet remediation
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bkl-031-f3-a3-platform-mutation
  cancel-in-progress: false

jobs:
  exact-subnet-remediation:
    name: Exact-head one-update Direct VPC subnet remediation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
      GCP_DATA_BUCKET: ${{ vars.GCP_DATA_BUCKET }}
      GCP_EVIDENCE_BUCKET: ${{ vars.GCP_EVIDENCE_BUCKET }}
      DSG_AUTHORIZED_COMMIT: ${{ inputs.expected_commit }}
      DSG_EXECUTION_NAME: dsg-f3-a3-spike-9drzb
      DSG_EVIDENCE_PREFIX: bkl-031/f3-a3/scientific-spike/9db0267529b6d46a2510b415e4b3f51d668ff024
      DSG_PLATFORM_STATE_SHA256: 084b68da6d20d9523ceabce67766cfc211b71f97ee12d8f4e7a0b4a64f57b89b
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_runtime_service_account_email: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TF_VAR_data_bucket_name: ${{ vars.GCP_DATA_BUCKET }}
      TF_VAR_evidence_bucket_name: ${{ vars.GCP_EVIDENCE_BUCKET }}
      TF_VAR_container_image_digest: europe-west8-docker.pkg.dev/digital-stargate-telemetry/dsg-f3-a3/spike@sha256:69a20a994fde9d5b1533b142760af5796b4ac795a1f00c658373a46d2648d60c
      TF_VAR_runner_source_commit: 9db0267529b6d46a2510b415e4b3f51d668ff024
      TF_VAR_kernel_artifact_sha256: 54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c
      TF_VAR_kernel_artifact_uri: gs://digital-stargate-telemetry-183451329061-f3-data/bkl-031/f3-a3/artifacts/spk/de442s/sha256/54d97562a5b094d298b1b8eafa5a2e17e3e010ce85e1a366d07f003ad159323c/de442s.bsp
      TF_VAR_method_profile_sha256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
      TF_VAR_method_profile_path: /app/dsg/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
      TF_VAR_iers_artifact_sha256: 43786a0a9b60c7a55a85e12307c0050d75ea0679710378141255ded9d1bd8ebc
      TF_VAR_owner_decision_ref: BKL-031-F3-A3-F3-OD05-APPROVAL-2026-09-16
      TF_VAR_job_name: dsg-f3-a3-spike
      TF_VAR_subnet_cidr: 10.88.0.0/26
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require exact authorized main head and identities
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "${DSG_AUTHORIZED_COMMIT}"
          grep -Eq '^[0-9a-f]{40}$' <<<"${GITHUB_SHA}"
          test "${GCP_PROJECT_ID}" = "digital-stargate-telemetry"
          test "${GCP_REGION}" = "europe-west8"
          test "${GCP_WIF_PROVIDER}" = "projects/183451329061/locations/global/workloadIdentityPools/dsg-f3-a3-github/providers/github-main"
          test "${GCP_DEPLOY_SERVICE_ACCOUNT}" = "dsg-f3-a3-deployer@digital-stargate-telemetry.iam.gserviceaccount.com"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Verify exact subnet remediation policy
        run: node .github/scripts/verify-bkl-031-f3-a3-direct-vpc-subnet-remediation.mjs

      - name: Authenticate to Google Cloud through main-only WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "583.0.0"

      - name: Require exact failed execution, empty evidence and current subnet
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" = "$GCP_DEPLOY_SERVICE_ACCOUNT"
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          gcloud storage cat "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/default.tfstate" >/tmp/platform-state-before.json
          gcloud compute networks subnets describe dsg-f3-a3-private-ew8 --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/subnet-before.json
          gcloud run jobs executions list --job=dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/executions-before.json
          gcloud run jobs executions describe "$DSG_EXECUTION_NAME" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/execution-before.json
          gcloud storage objects list "gs://${GCP_EVIDENCE_BUCKET}/${DSG_EVIDENCE_PREFIX}/**" --format=json >/tmp/evidence-before.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          state_raw = Path('/tmp/platform-state-before.json').read_bytes()
          if hashlib.sha256(state_raw).hexdigest() != '084b68da6d20d9523ceabce67766cfc211b71f97ee12d8f4e7a0b4a64f57b89b':
              raise SystemExit('platform state changed before subnet remediation')
          state = json.loads(state_raw)
          if state.get('serial') != 4 or state.get('lineage') != '2be9b82b-88d3-888f-4fcd-dded2f74f7f3' or len(state.get('resources', [])) != 4:
              raise SystemExit('platform state identity changed')
          subnet = json.loads(Path('/tmp/subnet-before.json').read_text())
          if subnet.get('ipCidrRange') != '10.88.0.0/28' or subnet.get('privateIpGoogleAccess') is not True:
              raise SystemExit(f'unexpected pre-remediation subnet: {subnet!r}')
          executions = json.loads(Path('/tmp/executions-before.json').read_text())
          execution = json.loads(Path('/tmp/execution-before.json').read_text())
          if len(executions) != 1 or execution.get('metadata', {}).get('name') != 'dsg-f3-a3-spike-9drzb':
              raise SystemExit('exclusive failed execution identity changed')
          status = execution.get('status', {})
          completed = [c for c in status.get('conditions', []) if c.get('type') == 'Completed']
          expected_message = 'Task dsg-f3-a3-spike-9drzb-task0 failed with exit code: 0 and message: Internal error running task.'
          if status.get('failedCount') != 1 or len(completed) != 1 or completed[0].get('status') != 'False' or completed[0].get('message') != expected_message:
              raise SystemExit(f'execution terminal failure changed: {status!r}')
          if json.loads(Path('/tmp/evidence-before.json').read_text()) != []:
              raise SystemExit('scientific evidence exists before remediation')
          PY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Create exact one-update saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform init -reconfigure -input=false -backend-config="bucket=${GCP_STATE_BUCKET}" -backend-config="prefix=bkl-031/f3-a3/platform"
          set +e
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform plan -input=false -lock-timeout=60s -detailed-exitcode -out=/tmp/subnet-remediation.tfplan
          plan_status=$?
          set -e
          test "$plan_status" -eq 2
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform show -json /tmp/subnet-remediation.tfplan >/tmp/subnet-remediation-plan.json

      - name: Verify exact subnet-only update before apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/subnet-remediation-plan.json').read_text())
          changes = [c for c in plan.get('resource_changes', []) if c.get('change', {}).get('actions') != ['no-op']]
          if len(changes) != 1 or changes[0].get('address') != 'google_compute_subnetwork.spike':
              raise SystemExit(f'unexpected changing resources: {[(c.get("address"), c.get("change", {}).get("actions")) for c in changes]!r}')
          change = changes[0]['change']
          if change.get('actions') != ['update'] or change.get('replace_paths') not in (None, []):
              raise SystemExit(f'unexpected subnet action: {change!r}')
          if change.get('before', {}).get('ip_cidr_range') != '10.88.0.0/28' or change.get('after', {}).get('ip_cidr_range') != '10.88.0.0/26':
              raise SystemExit('plan is not the reviewed /28 to /26 expansion')
          if plan.get('variables', {}).get('subnet_cidr', {}).get('value') != '10.88.0.0/26':
              raise SystemExit('planned subnet variable mismatch')
          if plan.get('resource_drift') not in (None, []):
              raise SystemExit(f'unexpected pre-plan resource drift: {plan.get("resource_drift")!r}')
          PY

      - name: Apply only the verified saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform apply -input=false -lock-timeout=60s /tmp/subnet-remediation.tfplan

      - name: Verify remediated subnet and preserved failed-execution boundary
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform state list | sort >/tmp/platform-state-list.txt
          cat >/tmp/expected-state-list.txt <<'EOF'
          google_cloud_run_v2_job.spike
          google_cloud_run_v2_job_iam_member.deployer_invoker
          google_compute_network.spike
          google_compute_subnetwork.spike
          EOF
          diff -u /tmp/expected-state-list.txt /tmp/platform-state-list.txt
          gcloud compute networks subnets describe dsg-f3-a3-private-ew8 --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/subnet-after.json
          gcloud run jobs executions list --job=dsg-f3-a3-spike --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json >/tmp/executions-after.json
          gcloud storage objects list "gs://${GCP_EVIDENCE_BUCKET}/${DSG_EVIDENCE_PREFIX}/**" --format=json >/tmp/evidence-after.json
          python - <<'PY'
          import json
          from pathlib import Path

          subnet = json.loads(Path('/tmp/subnet-after.json').read_text())
          if subnet.get('ipCidrRange') != '10.88.0.0/26' or subnet.get('privateIpGoogleAccess') is not True:
              raise SystemExit(f'subnet remediation failed: {subnet!r}')
          executions = json.loads(Path('/tmp/executions-after.json').read_text())
          if len(executions) != 1:
              raise SystemExit(f'execution inventory changed: {len(executions)}')
          if json.loads(Path('/tmp/evidence-after.json').read_text()) != []:
              raise SystemExit('scientific evidence appeared during subnet remediation')
          PY

      - name: Require immediate zero drift
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform -chdir=infrastructure/bkl-031-f3-a3-gcp/platform plan -input=false -lock-timeout=60s -detailed-exitcode -out=/tmp/platform-post-remediation.tfplan
          plan_status=$?
          set -e
          test "$plan_status" -eq 0

      - name: Record bounded subnet remediation facts
        shell: bash
        run: |
          set -euo pipefail
          gcloud storage cat "gs://${GCP_STATE_BUCKET}/bkl-031/f3-a3/platform/default.tfstate" >/tmp/platform-state-after.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          raw = Path('/tmp/platform-state-after.json').read_bytes()
          state = json.loads(raw)
          facts = {
              'sourceCommit': __import__('os').environ['GITHUB_SHA'],
              'savedPlan': '0_ADD_1_CHANGE_0_DESTROY',
              'changedResource': 'google_compute_subnetwork.spike',
              'subnetBefore': '10.88.0.0/28',
              'subnetAfter': '10.88.0.0/26',
              'platformStateSerial': state.get('serial'),
              'platformStateLineage': state.get('lineage'),
              'platformStateRawSha256': hashlib.sha256(raw).hexdigest(),
              'platformResources': len(state.get('resources', [])),
              'immediateDrift': 'ZERO',
              'existingExecutionCount': 1,
              'replacementExecution': 'NOT_EXECUTED',
              'scientificEvidenceObjectCount': 0,
          }
          print('DSG_SUBNET_REMEDIATION_FACTS=' + json.dumps(facts, sort_keys=True, separators=(',', ':')))
          PY
