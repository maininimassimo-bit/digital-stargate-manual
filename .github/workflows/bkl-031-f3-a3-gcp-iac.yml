  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkl-031-f3-a3-gcp-iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Static policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify immutable method profile and reject drift
        env:
          DSG_METHOD_PROFILE_PATH: infrastructure/bkl-031-f3-a3-gcp/method-profile/BKL-031-F3-A3-METHOD-PROFILE-001.json
          DSG_METHOD_PROFILE_SHA256: e69f60e5ed7f71cd982437f6ca3556b732d6ae9a46718995134aa64a7b7f67ca
        run: node .github/scripts/verify-bkl-031-f3-a3-method-profile.mjs
      - name: Verify exact container source and immutable build evidence
        run: node .github/scripts/verify-bkl-031-f3-a3-container-evidence.mjs
      - name: Verify isolation and fail-closed gates
        run: node .github/scripts/verify-bkl-031-f3-a3-gcp-bootstrap.mjs
      - name: Verify authenticated plan-only gate
        run: node .github/scripts/verify-bkl-031-f3-a3-platform-plan-gate.mjs
      - name: Verify Artifact Registry foundation gate
        run: node .github/scripts/verify-bkl-031-f3-a3-registry-foundation-gate.mjs
      - name: Verify Artifact Registry foundation read-only recovery gate
        run: node .github/scripts/verify-bkl-031-f3-a3-registry-foundation-verification.mjs
      - name: Verify exact OCI publication gate
        run: node .github/scripts/verify-bkl-031-f3-a3-exact-oci-publication.mjs
      - name: Verify exact four-resource platform apply gate
        run: node .github/scripts/verify-bkl-031-f3-a3-platform-apply-gate.mjs
      - name: Verify exact kernel acquisition and private upload gate
        run: node .github/scripts/verify-bkl-031-f3-a3-kernel-acquisition-upload.mjs
      - name: Verify bounded scientific runner source gate
        run: node .github/scripts/verify-bkl-031-f3-a3-scientific-runner-gate.mjs
      - name: Verify exact runner OCI publication gate
        run: node .github/scripts/verify-bkl-031-f3-a3-exact-runner-oci-publication.mjs
      - name: Verify exact runner platform update gate
        run: node .github/scripts/verify-bkl-031-f3-a3-runner-platform-update.mjs
      - name: Verify runner platform read-only verification gate
        run: node .github/scripts/verify-bkl-031-f3-a3-runner-platform-verification.mjs
      - name: Verify exact single scientific execution gate
        run: node .github/scripts/verify-bkl-031-f3-a3-exact-scientific-execution.mjs
      - name: Verify scientific execution read-only recovery gate
        run: node .github/scripts/verify-bkl-031-f3-a3-scientific-execution-recovery.mjs
      - name: Verify exact stuck scientific execution cancellation gate
        run: node .github/scripts/verify-bkl-031-f3-a3-scientific-execution-cancellation.mjs
      - name: Verify exact Direct VPC subnet remediation gate
        run: node .github/scripts/verify-bkl-031-f3-a3-direct-vpc-subnet-remediation.mjs
      - name: Verify exact single replacement scientific execution gate
        run: node .github/scripts/verify-bkl-031-f3-a3-exact-replacement-scientific-execution.mjs
      - name: Verify replacement execution read-only forensics gate
        run: node .github/scripts/verify-bkl-031-f3-a3-replacement-execution-forensics.mjs
      - name: Verify offline exact-kernel remediation gate
        run: node .github/scripts/verify-bkl-031-f3-a3-offline-exact-kernel-validation.mjs
      - name: Verify remediated runner OCI publication gate
        run: node .github/scripts/verify-bkl-031-f3-a3-remediated-runner-oci-publication.mjs
      - name: Verify remediated runner platform update gate
        run: node .github/scripts/verify-bkl-031-f3-a3-remediated-runner-platform-update.mjs

  terraform:
    name: Terraform validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infrastructure/bkl-031-f3-a3-gcp/bootstrap
          - infrastructure/bkl-031-f3-a3-gcp/registry
          - infrastructure/bkl-031-f3-a3-gcp/platform
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate -no-color

  container-build-evidence:
    name: Reproducible offline container build evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Acquire only reviewed wheels and verify exact bytes
        run: >-
          node .github/scripts/acquire-bkl-031-f3-a3-container-artifacts.mjs
          --destination infrastructure/bkl-031-f3-a3-gcp/container/.build/wheels
          --evidence infrastructure/bkl-031-f3-a3-gcp/container/.build/acquisition-evidence.json
      - name: Pull the reviewed base platform digest
        run: docker pull --platform linux/amd64 python:3.12.14-slim-bookworm@sha256:9c47360a2a0355e2da18516d0b1c2126ec22c195d2185e97347c9d98398c5bef
      - name: Start the reviewed BuildKit platform digest
        shell: bash
        run: |
          set -euo pipefail
          buildkit_image='moby/buildkit:v0.30.0@sha256:57269d1784e49b46228c45a1a1b870fbe40e0a639ab60b37b032d83af5bccdfc'
          docker pull --platform linux/amd64 "$buildkit_image"
          docker buildx create --name dsg-repro --driver docker-container --driver-opt "image=$buildkit_image" --use
          docker buildx inspect --bootstrap
      - name: Build twice without network and require identical image IDs
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version
          export SOURCE_DATE_EPOCH=0
          output='type=docker,dest=/tmp/dsg-candidate-a.tar,rewrite-timestamp=true,compatibility-version=30'
          docker buildx build --builder dsg-repro --platform linux/amd64 --network=none --pull=false --no-cache --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 --tag dsg-bkl031-f3a3:candidate --output "$output" --file infrastructure/bkl-031-f3-a3-gcp/container/Dockerfile infrastructure/bkl-031-f3-a3-gcp
          docker load --input /tmp/dsg-candidate-a.tar
          image_id_a="$(docker image inspect --format '{{.Id}}' dsg-bkl031-f3a3:candidate)"
          output='type=docker,dest=/tmp/dsg-candidate-b.tar,rewrite-timestamp=true,compatibility-version=30'
          docker buildx build --builder dsg-repro --platform linux/amd64 --network=none --pull=false --no-cache --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 --tag dsg-bkl031-f3a3:candidate --output "$output" --file infrastructure/bkl-031-f3-a3-gcp/container/Dockerfile infrastructure/bkl-031-f3-a3-gcp
          docker load --input /tmp/dsg-candidate-b.tar
          image_id_b="$(docker image inspect --format '{{.Id}}' dsg-bkl031-f3a3:candidate)"
          printf 'candidate-a=%s\ncandidate-b=%s\n' "$image_id_a" "$image_id_b"
          if [ "$image_id_a" != "$image_id_b" ]; then
            sha256sum /tmp/dsg-candidate-a.tar /tmp/dsg-candidate-b.tar
            exit 1
          fi
          echo "DSG_CONTAINER_IMAGE_ID=$image_id_a" | tee -a "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"
      - name: Execute fail-closed preflight with network disabled
        run: docker run --rm --network none dsg-bkl031-f3a3:candidate /bin/true
      - name: Prove absent scientific runner exits 78
        shell: bash
        run: |
          set +e
          output="$(docker run --rm --network none dsg-bkl031-f3a3:candidate 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 78
          grep -F "NOT_EXECUTED: scientific runner is not materialized" <<<"$output"
      - name: Record bounded build evidence without upload
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker image inspect --format '{{.Config.User}}' dsg-bkl031-f3a3:candidate)"
          architecture="$(docker image inspect --format '{{.Architecture}}' dsg-bkl031-f3a3:candidate)"
          operating_system="$(docker image inspect --format '{{.Os}}' dsg-bkl031-f3a3:candidate)"
          test "$user" = "65532:65532"
          test "$architecture" = "amd64"
          test "$operating_system" = "linux"
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"
          BKL-031-F3-A3-CONTAINER-BUILD-EVIDENCE
          sourceCommit=${GITHUB_SHA}
          sourceManifestSha256=02ceba17c1ac97f780cd545554b254ee668d840fcd85e11310d07c4ecc37e879
          imageId=${DSG_CONTAINER_IMAGE_ID}
          os=${operating_system}
          architecture=${architecture}
          user=${user}
          acquisition=EXACT_HASH_VERIFIED_EPHEMERAL
          buildNetwork=NONE
          buildkitImage=moby/buildkit:v0.30.0@sha256:57269d1784e49b46228c45a1a1b870fbe40e0a639ab60b37b032d83af5bccdfc
          buildkitCompatibilityVersion=30
          reproducibility=TWO_NO_CACHE_BUILDS_REWRITE_TIMESTAMP_IDENTICAL
          preflight=PASS_NETWORK_NONE
          scientificRunner=NOT_MATERIALIZED_EXIT_78
          imagePush=NOT_EXECUTED
          artifactUpload=NOT_EXECUTED
          platformPlanApply=NOT_EXECUTED
          scientificExecution=NOT_EXECUTED
          EOF

  scientific-runner-candidate:
    name: Reproducible scientific runner candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify runner source contract
        run: node .github/scripts/verify-bkl-031-f3-a3-scientific-runner-gate.mjs
      - name: Execute contract self-test without scientific libraries or network
        run: python infrastructure/bkl-031-f3-a3-gcp/runner/scientific_runner.py --contract-self-test
      - name: Acquire only reviewed wheels and verify exact bytes
        run: >-
          node .github/scripts/acquire-bkl-031-f3-a3-container-artifacts.mjs
          --destination infrastructure/bkl-031-f3-a3-gcp/container/.build/wheels
          --evidence infrastructure/bkl-031-f3-a3-gcp/container/.build/acquisition-evidence.json
      - name: Pull the reviewed base platform digest
        run: docker pull --platform linux/amd64 python:3.12.14-slim-bookworm@sha256:9c47360a2a0355e2da18516d0b1c2126ec22c195d2185e97347c9d98398c5bef
      - name: Start the reviewed BuildKit platform digest
        shell: bash
        run: |
          set -euo pipefail
          buildkit_image='moby/buildkit:v0.30.0@sha256:57269d1784e49b46228c45a1a1b870fbe40e0a639ab60b37b032d83af5bccdfc'
          docker pull --platform linux/amd64 "$buildkit_image"
          docker buildx create --name dsg-runner-repro --driver docker-container --driver-opt "image=$buildkit_image" --use
          docker buildx inspect --bootstrap
      - name: Build runner OCI twice without network and require identical identities
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=0
          for candidate in a b; do
            output="type=oci,dest=/tmp/dsg-runner-${candidate}.tar,oci-mediatypes=true,rewrite-timestamp=true,compatibility-version=30"
            docker buildx build --builder dsg-runner-repro --platform linux/amd64 --network=none --pull=false --no-cache --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 --metadata-file "/tmp/dsg-runner-${candidate}.json" --output "$output" --file infrastructure/bkl-031-f3-a3-gcp/container/Dockerfile.runner infrastructure/bkl-031-f3-a3-gcp
          done
          digest_a="$(jq -er '."containerimage.digest"' /tmp/dsg-runner-a.json)"
          digest_b="$(jq -er '."containerimage.digest"' /tmp/dsg-runner-b.json)"
          config_a="$(jq -er '."containerimage.config.digest"' /tmp/dsg-runner-a.json)"
          config_b="$(jq -er '."containerimage.config.digest"' /tmp/dsg-runner-b.json)"
          test "$digest_a" = "$digest_b"
          test "$config_a" = "$config_b"
          printf 'runner-manifest-a=%s\nrunner-manifest-b=%s\nrunner-config-a=%s\nrunner-config-b=%s\n' "$digest_a" "$digest_b" "$config_a" "$config_b" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DSG_RUNNER_MANIFEST_DIGEST=$digest_a" >> "$GITHUB_ENV"
          echo "DSG_RUNNER_CONFIG_DIGEST=$config_a" >> "$GITHUB_ENV"
      - name: Build one loadable runner and bind its image ID to the OCI config
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=0
          output='type=docker,dest=/tmp/dsg-runner-loadable.tar,rewrite-timestamp=true,compatibility-version=30'
          docker buildx build --builder dsg-runner-repro --platform linux/amd64 --network=none --pull=false --no-cache --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 --tag dsg-bkl031-f3a3:runner-candidate --output "$output" --file infrastructure/bkl-031-f3-a3-gcp/container/Dockerfile.runner infrastructure/bkl-031-f3-a3-gcp
          docker load --input /tmp/dsg-runner-loadable.tar
          image_id="$(docker image inspect --format '{{.Id}}' dsg-bkl031-f3a3:runner-candidate)"
          test "$image_id" = "$DSG_RUNNER_CONFIG_DIGEST"
          echo "DSG_RUNNER_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Run preflight and contract self-test with network disabled
        run: >-
          docker run --rm --network none
          dsg-bkl031-f3a3:runner-candidate
          python /app/dsg/runner/scientific_runner.py --contract-self-test
      - name: Record bounded candidate evidence without publication or execution
        shell: bash
        run: |
          set -euo pipefail
          cat <<EOF | tee -a "$GITHUB_STEP_SUMMARY"
          BKL-031-F3-A3-SCIENTIFIC-RUNNER-CANDIDATE
          sourceCommit=${GITHUB_SHA}
          runnerManifestSha256=11163d6ac4901341b409e686740a2090ae23f93eba08ed8b4aa8c8bb98c3f740
          ociManifestDigest=${DSG_RUNNER_MANIFEST_DIGEST}
          ociConfigDigest=${DSG_RUNNER_CONFIG_DIGEST}
          imageId=${DSG_RUNNER_IMAGE_ID}
          buildNetwork=NONE
          reproducibility=TWO_OCI_NO_CACHE_BUILDS_REWRITE_TIMESTAMP_IDENTICAL
          contractSelfTest=PASS_NETWORK_NONE
          containerPush=NOT_EXECUTED
          platformPlanApply=NOT_EXECUTED
          jobExecution=NOT_EXECUTED
          scientificExecution=NOT_EXECUTED
          externalReferenceTraffic=NOT_EXECUTED
          protectedSiteUse=NOT_EXECUTED
          runtimeActivation=NOT_EXECUTED
          EOF
