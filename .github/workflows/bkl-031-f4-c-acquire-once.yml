name: BKL-031 F4-C One Generalized Forecast Acquisition
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact authorized main commit
        required: true
        type: string
      run_initialisation_utc:
        description: Explicit ICON-2I run, YYYY-MM-DDT00:00Z or T12:00Z
        required: true
        type: string
      confirmation:
        description: Enter F4C_ONE_GENERALIZED_REQUEST
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: bkl-031-f4c-one-generalized-acquisition
  cancel-in-progress: false
jobs:
  acquire-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.expected_main_sha }}
      - name: Verify exact main head and confirmation
        env:
          EXPECTED: ${{ github.event.inputs.expected_main_sha }}
          CONFIRM: ${{ github.event.inputs.confirmation }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED"
          test "$CONFIRM" = "F4C_ONE_GENERALIZED_REQUEST"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight exact one-request plan
        run: node .github/scripts/observation-planner-forecast-f4c-acquire.mjs --preflight --run=${{ github.event.inputs.run_initialisation_utc }}
      - name: Execute exactly one generalized request
        run: node .github/scripts/observation-planner-forecast-f4c-acquire.mjs --execute --confirm=F4C_ONE_GENERALIZED_REQUEST --run=${{ github.event.inputs.run_initialisation_utc }} --out=work/f4c-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: bkl-031-f4c-evidence-${{ github.run_id }}
          path: work/f4c-evidence
          if-no-files-found: error
          retention-days: 7