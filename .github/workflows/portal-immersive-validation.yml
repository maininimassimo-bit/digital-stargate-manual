name: Immersive portal validation
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'hooks/**'
      - 'mkdocs*.yml'
      - '.github/scripts/*immersive*'
      - '.github/workflows/portal-immersive-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install mkdocs-material
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify presentation boundary and vendored files
        run: node .github/scripts/verify-immersive-assets.mjs
      - name: Build site
        run: python -m mkdocs build --strict --config-file mkdocs.pages.yml
      - name: Verify site links and assets
        run: python .github/scripts/verify-published-site.py --site site --base-path /digital-stargate-manual/
      - name: Navigation coverage
        run: python .github/scripts/verify-immersive-navigation.py
      - name: Browser regression (live providers blocked)
        env:
          DSG_TEST_BASE_URL: http://127.0.0.1:8766/
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory site > /tmp/portal-server.log 2>&1 &
          node .github/scripts/test-immersive-portal.cjs
          node .github/scripts/test-immersive-instruments.cjs
          node .github/scripts/test-immersive-dome-sync.cjs
          node .github/scripts/test-immersive-planner-sky.cjs
          node .github/scripts/test-immersive-navigation.cjs
          node .github/scripts/test-immersive-planner-refresh.cjs
