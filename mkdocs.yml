site_name: Digital StarGate
site_description: Manuale Tecnico dell'Osservatorio Remoto di Manciano
site_author: Massimo Mainini

docs_dir: docs
site_dir: site

theme:
  name: material
  language: it
  logo: assets/images/dsg-logo.svg
  favicon: assets/images/dsg-logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Passa alla modalità scura
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Passa alla modalità chiara

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - styles/theme-tokens.css
  - styles/extra.css
  - styles/analytics.css
  - styles/roadmap.css
  - styles/portal-shell.css
  - styles/bkl-034-image-gallery.css

extra_javascript:
  - javascripts/dsg-enterprise-core.js
  - javascripts/nav-scroll.js
  - javascripts/homepage-effects.js
  - javascripts/page-enhancements.js
  - javascripts/dsg-theme-manager.js
  - javascripts/observatory-status.js
  - javascripts/bkl-036-health-score.js
  - javascripts/latest-observation.js
  - javascripts/roadmap.js

not_in_nav: |
  session-reports/**/report-sessione.md

